# ZFS ARC sizing. Only drone-04 hosts a pool (rust, democratic-csi backend); the setting is a no-op elsewhere.
# Max ARC size => 5GiB == 5368709120 Bytes (was 2GiB; 98% hit ratio but ~1M demand data misses hitting the HDD mirror)
options zfs zfs_arc_max=5368709120

# Min ARC size => 1GiB == 1073741824 Bytes
options zfs zfs_arc_min=1073741824
