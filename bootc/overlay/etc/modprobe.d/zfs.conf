# ZFS ARC sizing. Default is sized for the three app nodes (drone-01/02/03),
# which each carry a node-local `k8s` pool alongside a dozen pods on ~22 GiB of
# RAM: 2 GiB is plenty for ~47 GB of zvols and stays out of the way of workloads.
# drone-04 is the exception (it is tainted dedicated=storage and runs nothing but
# ZFS + NFS); `ansible/roles/nas_zfs` drops /etc/modprobe.d/zz-zfs-arc.conf there
# with 10 GiB. The `zz-` prefix matters: modprobe.d is read in lexicographic order
# and the last `options zfs` wins, so a `99-` file would sort before this one and
# lose.
# Max ARC size => 2GiB == 2147483648 Bytes
options zfs zfs_arc_max=2147483648

# Min ARC size => 1GiB == 1073741824 Bytes
options zfs zfs_arc_min=1073741824
