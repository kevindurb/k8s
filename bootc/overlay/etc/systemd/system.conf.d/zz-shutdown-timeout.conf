# Fedora raises the stop timeout to 90s in
# /usr/lib/systemd/system.conf.d/longer-default-shutdown-timeout.conf, and every
# containerd container scope inherits it (KillMode=control-group). The containers
# that don't exit on SIGTERM - gpu-operator's validator, which is literally
# `while true; do sleep 86400; done`, democratic-csi's `cleanup` sidecar
# (`while true; do sleep 2; done`), s6-overlay supervisors - sit out the full 90s
# each, and get another 90s if they survive SIGKILL. Measured on drone-01: 90s +
# 90s of scope timeouts, then a 30s `sync` timeout = 3m30s to power off.
#
# The filename is load-bearing: system.conf.d drop-ins are applied in
# lexicographic order across /usr/lib and /etc and the last assignment wins, so
# this must sort after "longer-default-shutdown-timeout.conf" (digits sort before
# letters, so 10- or 90- would lose to it). Verify with
# `systemd-analyze cat-config systemd/system.conf`.
#
# 15s is still generous for anything that stops when asked. Units that genuinely
# need longer set TimeoutStopSec themselves; see
# nvmet.service.d/20-shutdown-order.conf, which flushes real data.
[Manager]
DefaultTimeoutStopSec=15s
