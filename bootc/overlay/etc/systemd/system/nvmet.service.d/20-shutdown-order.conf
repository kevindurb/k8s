# drone-04 mounts some of its own volumes through a loopback NVMe-oF initiator.
# Stop order is the reverse of start order, so After=k3s-agent.service makes k3s
# stop first. Then disconnect local initiators before `nvmetcli clear` removes the
# target; otherwise the final sync blocks on a dead device until systemd-shutdown
# times out (~3.5 min).
[Unit]
After=k3s-agent.service

[Service]
# Clear the inherited ExecStop so the disconnect runs before the clear.
ExecStop=
ExecStop=-/usr/sbin/nvme disconnect-all
ExecStop=/usr/sbin/nvmetcli clear
