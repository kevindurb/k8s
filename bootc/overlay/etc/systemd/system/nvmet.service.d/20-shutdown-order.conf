# drone-04 mounts some of its own volumes through a loopback NVMe-oF initiator.
# On shutdown, detach those before the target goes away; otherwise the final sync
# blocks on a dead device until systemd-shutdown times out (~3.5 min).
#
# k3s-agent.service orders itself After= this unit, so it stops first. That does not
# stop pods (KillMode=process): scale stateful apps down before rebooting
# (ansible/reboot-drone-04.yml). The script below is the safety net for anything left.
[Service]
# Clear the inherited ExecStop so the steps below run in this order.
ExecStop=
ExecStop=-/usr/libexec/nvmet-detach-local
ExecStop=-/usr/sbin/nvme disconnect-all
ExecStop=/usr/sbin/nvmetcli clear
