# drone-04 is both the NFS server and (via pods) its own NFS client.
# With delegations on, any mkdir/rename under an exported tree (e.g. `zfs create` of a child
# dataset) blocks in __break_lease until the local client returns the delegation, which can
# take minutes or never. Disable leases so nfsd never hands out delegations.
fs.leases-enable = 0
