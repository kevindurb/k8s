---
# DEPRECATED: Bitwarden Secrets Manager (BitwardenSecret) is being migrated to Sealed Secrets.
# Remove this component from an app's components: list as its secrets convert to SealedSecret — see docs/secrets.md.
nameReference:
  - kind: BitwardenSecret
    fieldSpecs:
      - path: spec/template/spec/containers/envFrom/secretRef/name
        kind: Deployment
      - path: spec/template/spec/containers/env/valueFrom/secretKeyRef/name
        kind: Deployment
      - path: spec/template/spec/initContainers/envFrom/secretRef/name
        kind: Deployment
      - path: spec/template/spec/initContainers/env/valueFrom/secretKeyRef/name
        kind: Deployment
      - path: spec/template/spec/volumes/secret/secretName
        kind: Deployment
      - path: spec/template/spec/containers/envFrom/secretRef/name
        kind: StatefulSet
      - path: spec/template/spec/containers/env/valueFrom/secretKeyRef/name
        kind: StatefulSet
      - path: spec/template/spec/initContainers/envFrom/secretRef/name
        kind: StatefulSet
      - path: spec/template/spec/initContainers/env/valueFrom/secretKeyRef/name
        kind: StatefulSet
      - path: spec/template/spec/volumes/secret/secretName
        kind: StatefulSet

nameSuffix:
  - path: spec/secretName
    kind: BitwardenSecret

namePrefix:
  - path: spec/secretName
    kind: BitwardenSecret
