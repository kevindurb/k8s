---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qbittorrent
namePrefix: qbittorrent-
resources:
  - ./deployment.yml
components:
  - ../../components/http-route-refs
  - ../../components/nas-media
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - qbittorrent.yml=gatus.yml
  - name: qbittorrent-defaults
    options:
      labels:
        app.kubernetes.io/component: app
    files:
      - qBittorrent.conf=config/qBittorrent.conf
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: qbittorrent
