---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  annotations:
    reloader.stakater.com/auto: 'true'
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes:
        - name: nas-media
          persistentVolumeClaim:
            claimName: nas-media
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: qbittorrent-defaults
          configMap:
            name: qbittorrent-defaults
        - name: tailscale-tmp
          emptyDir: {}
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: ts-state
      initContainers:
        - name: tailscale
          restartPolicy: Always
          image: ghcr.io/tailscale/tailscale:stable@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
          env:
            - name: TZ
              value: America/Denver
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-auth-key
                  key: TS_AUTHKEY
            - name: TS_USERSPACE
              value: 'true'
            - name: TS_SOCKS5_SERVER
              value: ':1055'
            - name: TS_HOSTNAME
              value: qbittorrent-vpn
            - name: TS_KUBE_SECRET
              value: ''
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_SOCKET
              value: /tmp/tailscaled.sock
            - name: TS_EXTRA_ARGS
              value: --exit-node=100.117.167.110 --exit-node-allow-lan-access=false
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tailscale-tmp
              mountPath: /tmp
            - name: tailscale-state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              memory: 128M
            limits:
              memory: 1500M
          # Gates the qbittorrent container from starting until the exit node is actually
          # connected, not just until tailscaled is up — closes the startup race where
          # qbittorrent could start proxying before Mullvad was reachable.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale --socket=/tmp/tailscaled.sock status --json | grep -A3 ExitNodeStatus | grep -Eq 'Online.*true'
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          # If the exit-node tunnel drops later (Mullvad relay issue, WireGuard handshake
          # failure), restart the sidecar rather than leaving qbittorrent silently proxying
          # through a dead tunnel.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale --socket=/tmp/tailscaled.sock status --json | grep -A3 ExitNodeStatus | grep -Eq 'Online.*true'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale --socket=/tmp/tailscaled.sock status --json | grep -A3 ExitNodeStatus | grep -Eq 'Online.*true'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      containers:
        - name: qbittorrent
          image: ghcr.io/home-operations/qbittorrent:5.1.2@sha256:31ac39705e31f7cdcc04dc46c1c0b0cdf8dc6f9865d4894efc097a33adc41524
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: config
              mountPath: /config
            - name: nas-media
              mountPath: /media
            - name: qbittorrent-defaults
              mountPath: /defaults/qBittorrent.conf
              subPath: qBittorrent.conf
              readOnly: true
          resources:
            requests:
              memory: 100M
            limits:
              memory: 2G
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts-state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s,tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [qbittorrent]

---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: ts-auth-key
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: app
spec:
  organizationId: 575f69b2-49f4-456d-bd6f-b14101103188
  secretName: ts-auth-key
  map:
    - secretKeyName: TS_AUTHKEY
      bwSecretId: 822466c3-b8de-4c68-a354-b4a40126a87a
  authToken:
    secretName: bw-auth-token
    secretKey: token
