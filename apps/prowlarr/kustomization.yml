---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prowlarr
namePrefix: prowlarr-
resources:
  - ./deployment.yml
components:
  - ../../components/storage-home-drone-03
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - prowlarr.yml=gatus.yml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: prowlarr
