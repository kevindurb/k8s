---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
  labels: &labels
    app.kubernetes.io/component: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-volume
        - name: tmp
          emptyDir: {}
        # Mount the socket dir itself: with a read-only rootfs the image's
        # /run/mysqld is not writable, and its entrypoint only recreates it
        # when running as root.
        - name: run-mysqld
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-mariadb-secret
                  key: ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: romm
            - name: MARIADB_USER
              value: romm-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-mariadb-secret
                  key: PASSWD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: tmp
              mountPath: /tmp
            - name: run-mysqld
              mountPath: /run/mysqld
            - name: var-log
              mountPath: /var/log
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: 256M
            limits:
              memory: 1G
          ports:
            - name: mysql
              containerPort: 3306

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-volume
  labels:
    app.kubernetes.io/component: mariadb
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  labels: &labels
    app.kubernetes.io/component: mariadb
spec:
  selector: *labels
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
