---
# RomM's init/envsubst writes into /etc/nginx/conf.d and /etc/gunicorn, so it
# cannot run with readOnlyRootFilesystem: true (the shared app-pod-hardening
# component forces it). Hardening is applied inline instead: non-root uid/gid
# 1000, no privilege escalation, all capabilities dropped. The app-tmp-dirs
# component is also skipped: mounting an emptyDir over /var/log hides the
# image's /var/log/nginx and breaks nginx. Only /tmp is a tmpfs, for RomM's
# cache and PID files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # RomM runs migrations immediately on start and exits if the DB is not
        # reachable yet, so wait for MariaDB to accept connections first.
        - name: wait-for-db
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - until nc -z romm-mariadb-service 3306; do echo "waiting for mariadb"; sleep 2; done
          resources:
            requests:
              memory: 16M
            limits:
              memory: 64M
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library
        - name: resources
          persistentVolumeClaim:
            claimName: resources
        - name: assets
          persistentVolumeClaim:
            claimName: assets
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
        # LaunchBox keeps its downloaded metadata DB under /romm/launchbox.
        - name: launchbox
          persistentVolumeClaim:
            claimName: launchbox
        - name: tmp
          emptyDir: {}
      containers:
        - name: app
          image: docker.io/rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: America/Denver
            - name: ROMM_BASE_URL
              value: https://romm.beaver-cloud.ts.net
            - name: ROMM_DB_DRIVER
              value: mariadb
            - name: DB_HOST
              value: romm-mariadb-service
            - name: DB_PORT
              value: '3306'
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-mariadb-secret
                  key: PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: ROMM_AUTH_SECRET_KEY
            - name: SCAN_WORKERS
              value: '4'
            - name: WEB_SERVER_CONCURRENCY
              value: '4'
            - name: HASHEOUS_API_ENABLED
              value: 'true'
            # Additional metadata providers. Playmatch (extra hash DB) and
            # LaunchBox (local, filename-matched DB) need no credentials;
            # ScreenScraper needs a free account.
            - name: PLAYMATCH_API_ENABLED
              value: 'true'
            - name: LAUNCHBOX_API_ENABLED
              value: 'true'
            - name: ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA
              value: 'true'
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: SCREENSCRAPER_USER
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: SCREENSCRAPER_PASSWORD
            # OIDC against Pocket ID (the client is created in the admin UI/API).
            - name: OIDC_ENABLED
              value: 'true'
            - name: OIDC_PROVIDER
              value: generic
            - name: OIDC_CLIENT_ID
              value: 'romm'
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              value: https://romm.beaver-cloud.ts.net/api/oauth/openid
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://idp.beaver-cloud.ts.net
            - name: OIDC_SERVER_METADATA_URL
              value: https://idp.beaver-cloud.ts.net/.well-known/openid-configuration
            - name: DISABLE_USERPASS_LOGIN
              value: 'true'
          volumeMounts:
            - name: library
              mountPath: /romm/library
            - name: resources
              mountPath: /romm/resources
            - name: assets
              mountPath: /romm/assets
            - name: config
              mountPath: /romm/config
            - name: redis-data
              mountPath: /redis-data
            - name: launchbox
              mountPath: /romm/launchbox
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              memory: 512M
            limits:
              memory: 6G
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resources
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assets
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: launchbox
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:media
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [romm]
