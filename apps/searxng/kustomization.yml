---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searxng
namePrefix: searxng-
resources:
  - ./deployment.yml
  - ./searxng-sealed-secret.yml
components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
configMapGenerator:
  - name: settings
    files:
      - settings.yml
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - searxng.yml=gatus.yml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: searxng
