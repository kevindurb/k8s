---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: template
  namespace: argocd
spec:
  project: apps
  sources:
    - repoURL: https://forgejo.beaver-cloud.xyz/kevindurb/k8s.git
      targetRevision: HEAD
      path: apps/template
  destination:
    server: https://kubernetes.default.svc
    namespace: template
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      prune: false
      selfHeal: true
