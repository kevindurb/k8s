; Vault sync configuration for Obsidian LiveSync clients.
; Loaded from local.d after docker.ini, so these values win.
; Runtime configuration changes made through the admin API are discarded on
; restart: this file is the only source of truth.

[couchdb]
; Create the system databases (_users, _replicator) on startup.
single_node = true
; Absolute paths: the defaults are relative to the launcher's working directory.
database_dir = /opt/couchdb/data
view_index_dir = /opt/couchdb/data
; The rootfs is read-only; the URI file is the only other thing CouchDB writes.
uri_file = /tmp/couchdb.uri
; 50 MB per document: LiveSync chunks notes, but attachments ride along.
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
; Authentication is mandatory on every request.
require_valid_user = true
enable_cors = true
admin_only_all_dbs = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
credentials = true
; The exact origins Obsidian uses on desktop and mobile.
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept,authorization,content-type,origin,referer,x-csrf-token
methods = GET,HEAD,POST,PUT,DELETE,OPTIONS

[compactions]
; LiveSync writes many revisions per note; compact automatically.
_default = [{db_fragmentation, "50%"}, {view_fragmentation, "50%"}]

[log]
level = warning
