---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  # Recreate, never RollingUpdate: the pod owns a ReadWriteOnce volume, so a
  # second instance must never exist alongside it.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      # The image runs as the couchdb user (5984:5984); components/app-pod-hardening
      # hardcodes uid 1000, so this app carries its own explicit context instead.
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The entrypoint writes into /opt/couchdb/etc (docker.ini, chmod), which
        # fails on a read-only rootfs. Seed a writable copy of the image's etc
        # directory and add our config fragment to it.
        - name: config-init
          image: docker.io/library/couchdb:3.5.3@sha256:907eab5b7e55ab7cfd241d39b90b2a335ea40bef82acee5a37388c08bf201dda
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /etc-couchdb/local.d
              # -a would try to preserve the emptyDir root's timestamps, which
              # a non-root user cannot do; a plain recursive copy is enough.
              cp -R /opt/couchdb/etc/. /etc-couchdb/
              cp /config/zz-livesync.ini /etc-couchdb/local.d/zz-livesync.ini
              chmod -R u+rwX /etc-couchdb
              chmod 0644 /etc-couchdb/local.d/zz-livesync.ini
          volumeMounts:
            - name: etc
              mountPath: /etc-couchdb
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 16M
            limits:
              memory: 64M
      containers:
        - name: app
          image: docker.io/library/couchdb:3.5.3@sha256:907eab5b7e55ab7cfd241d39b90b2a335ea40bef82acee5a37388c08bf201dda
          env:
            - name: TZ
              value: America/Denver
            # Erlang creates .erlang.cookie in $HOME on first start; keep that
            # inside the writable temporary directory rather than the image.
            - name: HOME
              value: /tmp
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: livesync-credentials
                  key: admin-user
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: livesync-credentials
                  key: admin-password
            - name: COUCHDB_DATABASE
              value: obsidiannotes
            - name: VAULT_USER
              valueFrom:
                secretKeyRef:
                  name: livesync-credentials
                  key: vault-user
            - name: VAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: livesync-credentials
                  key: vault-password
          ports:
            - name: http
              containerPort: 5984
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: etc
              mountPath: /opt/couchdb/etc
            - name: config
              mountPath: /opt/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          lifecycle:
            postStart:
              exec:
                command: [/bin/sh, /opt/config/init-vault.sh]
          # /_up is deliberately unauthenticated; the Gatus check below still
          # asserts that an unauthenticated request to / is refused.
          startupProbe:
            httpGet:
              path: /_up
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256M
            limits:
              memory: 1Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 5984
            runAsGroup: 5984
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: etc
          emptyDir: {}
        - name: config
          configMap:
            name: config
            # 0555 in octal, written in decimal so yamllint does not reject it.
            defaultMode: 365
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [livesync]
