---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      containers:
        - name: app
          image: ghcr.io/sissbruecker/linkding@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
          env:
            - name: TZ
              value: America/Denver
            - name: OIDC_OP_AUTHORIZATION_ENDPOINT
              value: https://idp.beaver-cloud.ts.net/authorize
            - name: OIDC_OP_TOKEN_ENDPOINT
              value: https://idp.beaver-cloud.ts.net/token
            - name: OIDC_OP_USER_ENDPOINT
              value: https://idp.beaver-cloud.ts.net/userinfo
            - name: OIDC_OP_JWKS_ENDPOINT
              value: https://idp.beaver-cloud.ts.net/.well-known/jwks.json
            - name: LD_ENABLE_OIDC
              value: '1'
            - name: LD_DISABLE_LOGIN_FORM
              value: '1'
          envFrom:
            - secretRef:
                name: tsidp
          volumeMounts:
            - name: data
              mountPath: /etc/linkding/data
          resources:
            requests:
              memory: 128M
            limits:
              memory: 256M
          ports:
            - name: http
              containerPort: 9090

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 1G

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s,tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [linkding]

---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: tsidp
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: app
spec:
  organizationId: 575f69b2-49f4-456d-bd6f-b14101103188
  secretName: tsidp
  map:
    - secretKeyName: OIDC_RP_CLIENT_ID
      bwSecretId: e7d5f245-f964-4972-9c3a-b4ce00d77e4e
    - secretKeyName: OIDC_RP_CLIENT_SECRET
      bwSecretId: d8a29415-8104-47c4-81d1-b4ce00d79263
  authToken:
    secretName: bw-auth-token
    secretKey: token
