---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ente
namePrefix: ente-

resources:
  - ./museum.yml
  - ./web.yml
  - ./garage.yml
  - ./postgres.yml
  - ./secret-sealed-secret.yml

components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - ente.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: ente
