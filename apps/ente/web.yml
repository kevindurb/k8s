---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels: &labels
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      # Deliberately no app-pod-hardening: nginx runs as root and the image's
      # entrypoint rewrites ENTE_API_ORIGIN into /out/**/*.js on every start,
      # so the root filesystem has to stay writable and owned by root.
      volumes: []
      containers:
        - name: web
          image: ghcr.io/ente/web:latest@sha256:b59f681175405a769325ff542a6f4420e9cf8fbd5c538ea9812a75fcc004e056
          env:
            - name: TZ
              value: America/Denver
            - name: ENTE_API_ORIGIN
              value: https://ente-api.beaver-cloud.ts.net
          volumeMounts: []
          resources:
            requests:
              memory: 32M
            limits:
              memory: 256M
          ports:
            - name: http
              containerPort: 3000
            - name: albums
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels: &labels
    app.kubernetes.io/component: web
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: albums
      port: 3002
      targetPort: albums

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  defaultBackend:
    service:
      name: web-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [ente]

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: albums-ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  defaultBackend:
    service:
      name: web-service
      port:
        name: albums
  ingressClassName: tailscale
  tls:
    - hosts: [ente-albums]
