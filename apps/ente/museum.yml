---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes:
        - name: config
          secret:
            secretName: ente-secret
            defaultMode: 0o440
      containers:
        - name: museum
          image: ghcr.io/ente/server:latest@sha256:4dba9930b25f6595d17cb28c41c299a6238b803f0244f9027703436fb4fa8aff
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: config
              mountPath: /museum.yaml
              subPath: museum.yaml
              readOnly: true
          resources:
            requests:
              memory: 256M
            limits:
              memory: 1G
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: museum-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  defaultBackend:
    service:
      name: museum-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [ente-api]
