---
# Capacity, not a disk quota: a local-path or zfs PVC request is a request, so
# ephemeral-storage here is what actually bounds a computer's scratch space.
# These numbers must move with KUBERNETES_SANDBOX_CPU_LIMIT and
# KUBERNETES_SANDBOX_MEMORY_LIMIT in apps/rakazo/config.env.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: computers
  namespace: rakazo-sandboxes
spec:
  hard:
    pods: "2"
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: computers
  namespace: rakazo-sandboxes
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 8Gi
      defaultRequest:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 2Gi
