---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no global `namespace:`: this root owns objects in two namespaces
# (rakazo-sandboxes for the computer boundary, tailscale for the ingress peer
# Service), and kustomize's namespace transformer would rewrite them all to one
# value. Every resource names its own namespace instead.
#
# The bot computers themselves are created at runtime by the Rakazo controller,
# not by kustomize, and the admission policy that constrains them lives in
# apps/rakazo so its pinned image can be rendered from rakazo-config's
# KUBERNETES_SANDBOX_COMPUTER_IMAGE (kustomize replacements cannot cross roots).
namePrefix: rakazo-

resources:
  - ./rbac.yml
  - ./quota.yml
  - ./network-policy.yml
  - ./ingress-peers.yml

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: rakazo-sandboxes
