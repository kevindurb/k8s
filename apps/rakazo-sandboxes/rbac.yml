---
# The Rakazo controller (a ServiceAccount in the app namespace) is the only
# identity that may touch computer Pods. Deliberately namespaced and minimal:
# create/get/delete Pods and open exec sessions, nothing else. It cannot read
# Secrets here, cannot touch Pods in another namespace, and cannot delete the
# app's own Pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: computers
  namespace: rakazo-sandboxes
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: computers
  namespace: rakazo-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: computers
subjects:
  - kind: ServiceAccount
    name: rakazo-controller
    namespace: rakazo
