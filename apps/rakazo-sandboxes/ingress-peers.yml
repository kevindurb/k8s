---
# Headless Service over the shared Tailscale ingress proxy Pods, so the API can
# be told which hops are allowed to set X-Forwarded-For (TRUSTED_PROXIES).
#
# It lives in the `tailscale` namespace, which is why this kustomization has no
# global `namespace:` field. The selector matches the shared ProxyGroup
# (tailscale.com/parent-resource-type=proxygroup), not a per-Ingress proxy: this
# app uses tailscale.com/proxy-group: ingress-proxy-group, so no per-Ingress
# proxy Pod exists. Trusting the whole group is correct — any member of it can
# already reach the app's Ingress.
#
# Until the app's Ingress exists this Service has no endpoints; that is harmless,
# the API's TRUSTED_PROXIES entry simply resolves to nothing.
apiVersion: v1
kind: Service
metadata:
  name: ingress-peers
  namespace: tailscale
spec:
  clusterIP: None
  selector:
    tailscale.com/managed: "true"
    tailscale.com/parent-resource-type: proxygroup
    tailscale.com/parent-resource: ingress-proxy-group
  ports:
    - name: https
      port: 443
      targetPort: 443
