---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homer
namePrefix: homer-

resources:
  - ./deployment.yml

components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - homer.yml=gatus.yml
  - name: config
    files:
      - ./config/config.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: homer
