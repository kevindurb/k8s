---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-deployment
  labels: &labels
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: runner-volume
        - name: runner-config
          secret:
            secretName: runner-config
        - name: podman-socket
          emptyDir: {}
        - name: podman-storage
          emptyDir: {}
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tmp
          emptyDir: {}
        - name: var-tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eu
              # The podman sidecar can take a while to pull its image and start
              # its API service; the daemon doesn't retry a failed initial
              # connection, it just exits, so wait for the socket first.
              until [ -e /podman/podman.sock ]; do
                sleep 1
              done
              exec forgejo-runner daemon --config /etc/forgejo-runner/config.yml
          env:
            - name: DOCKER_HOST
              value: unix:///podman/podman.sock
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: podman-socket
              mountPath: /podman
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            requests:
              memory: 256M
            limits:
              memory: 1G
        - name: podman
          image: quay.io/podman/stable:latest
          command:
            - podman
            - system
            - service
            - --time=0
            - unix:///podman/podman.sock
          securityContext:
            privileged: false
            # newuidmap/newgidmap (needed to set up rootless user namespaces) are
            # setuid-root binaries, so this can't be false like the other containers.
            allowPrivilegeEscalation: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              # NET_ADMIN is needed to set up the tap device for rootless
              # networking (pasta); without it, job containers fail to start
              # with "Failed to set up tap device in namespace".
              add: [SETUID, SETGID, NET_ADMIN]
              drop: [ALL]
          volumeMounts:
            - name: podman-socket
              mountPath: /podman
            - name: podman-storage
              mountPath: /home/podman/.local/share/containers
            - name: dev-fuse
              mountPath: /dev/fuse
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            requests:
              memory: 512M
            limits:
              memory: 4G

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-volume
  labels:
    app.kubernetes.io/component: runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 2G

---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: runner-config
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: runner
spec:
  organizationId: 575f69b2-49f4-456d-bd6f-b14101103188
  secretName: runner-config
  map:
    - secretKeyName: config.yml
      bwSecretId: c02f12b6-6e31-45aa-bc1b-b4b00166b1b3
  authToken:
    secretName: bw-auth-token
    secretKey: token
