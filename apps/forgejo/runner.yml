---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runner-statefulset
  labels: &labels
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: runner-config
          configMap:
            name: runner-config
        - name: podman-socket
          emptyDir: {}
        - name: podman-storage
          emptyDir: {}
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: tmp
          emptyDir: {}
        - name: var-tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      initContainers:
        - name: register
          image: data.forgejo.org/forgejo/runner:13
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eu
              if [ ! -f /data/.runner ]; then
                forgejo-runner register --no-interactive \
                  --instance "$GITEA_INSTANCE_URL" \
                  --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
                  --name "$GITEA_RUNNER_NAME" \
                  --labels "$GITEA_RUNNER_LABELS" \
                  --config /etc/forgejo-runner/config.yml
              fi
          env:
            - name: GITEA_INSTANCE_URL
              value: https://forgejo.beaver-cloud.xyz
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_NAME
              value: k8s-podman-runner-$(POD_NAME)
            - name: GITEA_RUNNER_LABELS
              value: podman:docker://ghcr.io/catthehacker/ubuntu:act-22.04
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-secret
                  key: REGISTRATION_TOKEN
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          command: ['forgejo-runner', 'daemon', '--config', '/etc/forgejo-runner/config.yml']
          env:
            - name: DOCKER_HOST
              value: unix:///podman/podman.sock
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/forgejo-runner
            - name: podman-socket
              mountPath: /podman
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            requests:
              memory: 256M
            limits:
              memory: 1G
        - name: podman
          image: quay.io/podman/stable:latest
          command:
            - podman
            - system
            - service
            - --time=0
            - unix:///podman/podman.sock
          securityContext:
            privileged: false
            # newuidmap/newgidmap (needed to set up rootless user namespaces) are
            # setuid-root binaries, so this can't be false like the other containers.
            allowPrivilegeEscalation: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              add: [SETUID, SETGID]
              drop: [ALL]
          volumeMounts:
            - name: podman-socket
              mountPath: /podman
            - name: podman-storage
              mountPath: /home/podman/.local/share/containers
            - name: dev-fuse
              mountPath: /dev/fuse
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            requests:
              memory: 512M
            limits:
              memory: 4G
  volumeClaimTemplates:
    - metadata:
        name: runner-data
        labels:
          app.kubernetes.io/component: runner
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-replicated
        resources:
          requests:
            storage: 2G

---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: runner-secret
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: runner
spec:
  organizationId: 575f69b2-49f4-456d-bd6f-b14101103188
  secretName: runner-secret
  map:
    - secretKeyName: REGISTRATION_TOKEN
      bwSecretId: 290102ee-0d77-4149-8983-b4b0016302b2
  authToken:
    secretName: bw-auth-token
    secretKey: token
