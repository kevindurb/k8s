---
apiVersion: v1
kind: Pod
metadata:
  name: PLACEHOLDER
  namespace: transcoding
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: drone-04
  tolerations:
    - {key: dedicated, operator: Equal, value: storage, effect: NoSchedule}
  volumes:
    - name: nas-media
      persistentVolumeClaim: {claimName: nas-media, readOnly: true}
  containers:
    - name: list
      image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command: ["sh", "-c"]
      args: ["PLACEHOLDER"]
      volumeMounts:
        - {name: nas-media, mountPath: /media, readOnly: true}
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {memory: 128Mi}
