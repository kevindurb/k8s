---
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER
  namespace: transcoding
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: drone-04
      tolerations:
        - {key: dedicated, operator: Equal, value: storage, effect: NoSchedule}
      volumes:
        - name: nas-media
          persistentVolumeClaim: {claimName: nas-media}
      containers:
        - name: handbrake
          image: ghcr.io/kevindurb/handbrake-cli:latest@sha256:346e4604e682543cd29586e011016514847981ef2b3b6afdc7dfa0388d70c9e1
          command: ["sh", "-c"]
          args: ["PLACEHOLDER"]
          volumeMounts:
            - {name: nas-media, mountPath: /media}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 8Gi}
