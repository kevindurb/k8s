---
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER
  namespace: transcoding
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: drone-04
      volumes:
        - name: nas-media
          persistentVolumeClaim: {claimName: nas-media}
      containers:
        - name: handbrake
          image: ghcr.io/kevindurb/handbrake-cli:latest@sha256:64a93d456932ff4e7504502c64be56373c536fd6c424e8ebad31a21144fb0932
          command: ["sh", "-c"]
          args: ["PLACEHOLDER"]
          volumeMounts:
            - {name: nas-media, mountPath: /media}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 8Gi}
