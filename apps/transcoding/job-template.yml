---
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER
  namespace: transcoding
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: drone-04
      volumes:
        - name: nas-media
          persistentVolumeClaim: {claimName: nas-media}
      containers:
        - name: handbrake
          image: ghcr.io/kevindurb/handbrake-cli:latest@sha256:d5bdc49768b7e2002e4a1eb56bf6bd3e821c8be4e36c7b1aaa28b9f119804eb9
          command: ["sh", "-c"]
          args: ["PLACEHOLDER"]
          volumeMounts:
            - {name: nas-media, mountPath: /media}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 8Gi}
