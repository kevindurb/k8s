---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: consignment-app
namePrefix: consignment-app-
resources:
  - ./deployment.yml
components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - consignment-app.yml=gatus.yml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: consignment-app
