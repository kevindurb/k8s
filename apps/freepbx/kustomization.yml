---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: freepbx
namePrefix: freepbx-

resources:
  - ./deployment.yml

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - freepbx.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: freepbx
