---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      # SIP/RTP can't be proxied through the Tailscale ingress — the container binds
      # its ports directly on the node IP so LAN phones can reach it (see omada).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: mysql
          persistentVolumeClaim:
            claimName: mysql
        - name: logs
          persistentVolumeClaim:
            claimName: logs
        - name: certs
          emptyDir: {}
      containers:
        - name: app
          # First boot installs FreePBX from Sangoma packages: can take up to ~30 minutes.
          image: docker.io/savagecore/freepbx:17@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
          env:
            - name: TZ
              value: America/Denver
            # FreePBX requires MySQL/MariaDB (no sqlite support); use the bundled
            # in-container MariaDB — no external DB or credentials needed.
            - name: DB_EMBEDDED
              value: 'TRUE'
            - name: ENABLE_SSL
              value: 'FALSE'
            - name: UCP_FIRST
              value: 'FALSE'
            # Needs to manipulate host iptables; with hostNetwork it would block
            # IPs on the node itself, so keep it off.
            - name: ENABLE_FAIL2BAN
              value: 'FALSE'
            # Audio stream range; UDP 18000-18100 is bound directly on the node (see
            # hostNetwork above) and must match FreePBX's Asterisk SIP Settings.
            - name: RTP_START
              value: '18000'
            - name: RTP_FINISH
              value: '18100'
          envFrom: []
          volumeMounts:
            - name: data
              mountPath: /data
            - name: mysql
              mountPath: /var/lib/mysql
            - name: logs
              mountPath: /var/log
            - name: certs
              mountPath: /certs
          resources:
            requests:
              memory: 512M
            limits:
              memory: 2G
          ports:
            - name: http
              containerPort: 80
            - name: pjsip
              protocol: UDP
              containerPort: 5060
            - name: sip
              protocol: UDP
              containerPort: 5160
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 10G
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 5G
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 2G
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s,tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [freepbx]
