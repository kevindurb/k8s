---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes: []
      containers:
        - name: app
          image: ghcr.io/miniflux/miniflux@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
          env:
            - name: TZ
              value: America/Denver
            - name: RUN_MIGRATIONS
              value: '1'
            - name: INTEGRATION_ALLOW_PRIVATE_NETWORKS
              value: '1'
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: 'postgres://miniflux:$(DATABASE_PASSWORD)@miniflux-postgres-service.miniflux/miniflux?sslmode=disable'
            - name: BASE_URL
              value: https://miniflux.beaver-cloud.ts.net
            - name: OAUTH2_OIDC_DISCOVERY_ENDPOINT
              value: https://idp.beaver-cloud.ts.net
            - name: OAUTH2_OIDC_PROVIDER_NAME
              value: tsidp
            - name: OAUTH2_PROVIDER
              value: oidc
            - name: OAUTH2_REDIRECT_URL
              value: https://miniflux.beaver-cloud.ts.net/oauth2/oidc/callback
            - name: OAUTH2_USER_CREATION
              value: '1'
            - name: DISABLE_LOCAL_AUTH
              value: '1'
          envFrom:
            - secretRef:
                name: miniflux-tsidp
          volumeMounts: []
          resources:
            requests:
              memory: 128M
            limits:
              memory: 256M
          ports:
            - name: http
              containerPort: 8080
          # /liveness and /readyz are served at the router root and ignore
          # BASE_PATH; /readyz also verifies the database connection.
          startupProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [miniflux]
