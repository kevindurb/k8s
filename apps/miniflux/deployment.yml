---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes: []
      containers:
        - name: app
          image: ghcr.io/miniflux/miniflux@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
          env:
            - name: TZ
              value: America/Denver
            - name: RUN_MIGRATIONS
              value: '1'
            - name: INTEGRATION_ALLOW_PRIVATE_NETWORKS
              value: '1'
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: 'postgres://miniflux:$(DATABASE_PASSWORD)@miniflux-postgres-service.miniflux/miniflux?sslmode=disable'
            - name: BASE_URL
              value: https://miniflux.beaver-cloud.ts.net
            - name: OAUTH2_OIDC_DISCOVERY_ENDPOINT
              value: https://idp.beaver-cloud.ts.net
            - name: OAUTH2_OIDC_PROVIDER_NAME
              value: tsidp
            - name: OAUTH2_PROVIDER
              value: oidc
            - name: OAUTH2_REDIRECT_URL
              value: https://miniflux.beaver-cloud.ts.net/oauth2/oidc/callback
            - name: OAUTH2_USER_CREATION
              value: '1'
            - name: DISABLE_LOCAL_AUTH
              value: '1'
          envFrom:
            - secretRef:
                name: tsidp
          volumeMounts: []
          resources:
            requests:
              memory: 128M
            limits:
              memory: 256M
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s,tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [miniflux]

---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: tsidp
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: postgres
spec:
  organizationId: 575f69b2-49f4-456d-bd6f-b14101103188
  secretName: tsidp
  map:
    - secretKeyName: OAUTH2_CLIENT_ID
      bwSecretId: 752fc36d-c872-4cac-a188-b4cd014c4603
    - secretKeyName: OAUTH2_CLIENT_SECRET
      bwSecretId: 0b869e11-d833-4bc1-affd-b4cd014c8496
  authToken:
    secretName: bw-auth-token
    secretKey: token
