---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: &labels
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: api
spec:
  selector: *labels
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: &labels
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: web
spec:
  selector: *labels
  ports:
    - name: http
      port: 5173
      targetPort: http
---
# Headless: TRUSTED_PROXIES needs the web Pod IPs, not a virtual Service IP,
# or the API cannot tell the real client hop from this pod.
apiVersion: v1
kind: Service
metadata:
  name: web-peers
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: web
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 5173
      targetPort: http
