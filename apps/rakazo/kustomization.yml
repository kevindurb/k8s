---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rakazo
namePrefix: rakazo-

resources:
  - ./service-account.yml
  - ./secrets-sealed-secret.yml
  - ./oidc-sealed-secret.yml
  - ./postgres.yml
  - ./workloads.yml
  - ./services.yml
  - ./ingress.yml
  - ./network-policies.yml
  - ./admission-policy.yml
  - ./migration-state.yml
  - ./migrate.yml
  - ./bootstrap.yml

configMapGenerator:
  - name: config
    envs:
      - ./config.env
    options:
      disableNameSuffixHash: true
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - rakazo.yml=gatus.yml

# The admission policy pins the computer image. Rendering it from the same
# ConfigMap the controller reads means the image the controller creates and the
# image admission permits cannot disagree. The delimiter/index trick comes from
# upstream's example: the expression's image list is
#   ['<current>', '<previous>']
# so index 1 is the current digest and index 3 the previous one.
replacements:
  - source:
      kind: ConfigMap
      name: config
      fieldPath: data.KUBERNETES_SANDBOX_COMPUTER_IMAGE
    targets:
      - select:
          kind: ValidatingAdmissionPolicy
          name: computers
        fieldPaths:
          - spec.validations.0.expression
        options:
          delimiter: "'"
          index: 1
  - source:
      kind: ConfigMap
      name: config
      fieldPath: data.PREVIOUS_COMPUTER_IMAGE
    targets:
      - select:
          kind: ValidatingAdmissionPolicy
          name: computers
        fieldPaths:
          - spec.validations.0.expression
        options:
          delimiter: "'"
          index: 3

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: rakazo
