---
# Runs before the application workloads on every sync (wave 1, Sync hook). Argo
# CD waits for the Job to complete before it applies wave 2, so no process can
# start against an unmigrated schema. BeforeHookCreation makes the immutable Job
# re-creatable; prisma migrate deploy is idempotent, so re-running is the safety
# net rather than a hazard.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakazo
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Same pin as the api/worker Deployments: these run the same image, and
      # the copy that exists on that node is the one already pulled.
      nodeSelector:
        kubernetes.io/hostname: drone-03
      containers:
        - name: app
          image: ghcr.io/elie222/rakazo/app:v0.13.0@sha256:a771451af0a789f75165c46e1d4a340ec2e1717208a599c4c7e1b5996e137c1b
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            # Owner login: only this Job sees one that can bypass row-level
            # security, and it creates/updates the restricted app login.
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_MIGRATION_URL
            - name: RAKAZO_DEPLOYED_MIGRATIONS
              valueFrom:
                configMapKeyRef:
                  name: rakazo-migration-state
                  key: RAKAZO_DEPLOYED_MIGRATIONS
          command:
            - node
            - dist/cli/migrate-database.js
          workingDir: /app/apps/api
