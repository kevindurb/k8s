---
# Creates the one owner account after the workloads are healthy. Signups stay
# closed, so this is the only account-creation path, and SSO can only link to
# it afterwards. It re-runs on every sync: if a future release refuses to run
# against an existing owner, remove this file from the root and run the same
# command once by hand (docs/rakazo.md keeps the procedure).
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rakazo
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/elie222/rakazo/app:v0.12.0@sha256:0ede140417319081bf646c97768976aaf0643e07b8ca2970d43da789ecff3b82
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: BETTER_AUTH_SECRET
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: OWNER_PASSWORD
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node
            - dist/cli/bootstrap-owner.js
          workingDir: /app/apps/api
