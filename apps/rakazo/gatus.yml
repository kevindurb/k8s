---
# Checked over the tailnet origin, not the ClusterIP Service, for two reasons
# recorded in docs/rakazo.md: /rpc/health is not a GET endpoint (405), and this
# cluster's CNI does not currently honour a cross-namespace ingress allow rule
# for a plain pod (the `rakazo-allow-monitoring` policy is correct per the spec
# but not enforced), so a ClusterIP probe from the gatus namespace times out.
#
# /api/auth/ok is public and proves the whole path: tailnet ingress proxy -> web
# -> api.
endpoints:
  - name: rakazo
    group: apps
    url: https://rakazo.beaver-cloud.ts.net/api/auth/ok
    conditions:
      - '[STATUS] == 200'
