---
# Migration safety input, kept apart from the app config so an operator can
# record the last fully deployed release without touching runtime settings.
#
# Empty is the explicit, conservative initial value: on a nonempty database the
# migration Job then keeps deferred drops held back. See docs/rakazo.md before
# changing it - it belongs to the release that is actually running.
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-state
  namespace: rakazo
data:
  RAKAZO_DEPLOYED_MIGRATIONS: ""
