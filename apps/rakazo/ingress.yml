---
# Tailnet only. No Funnel annotation, no LoadBalancer, no NodePort: the app runs
# agent code with a shell, so its only surface is the tailnet hostname served by
# the shared ingress ProxyGroup.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - rakazo
  defaultBackend:
    service:
      name: web
      port:
        name: http
