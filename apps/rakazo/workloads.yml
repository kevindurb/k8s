---
# api and worker both mount the bot-data volume, which is a single-writer zvol:
# there is no RWX class here, so both are pinned to one node with the same
# nodeSelector, and the Jobs that run the same image (migrate.yml,
# bootstrap.yml) carry it too so their pulls resolve on that node. Recreate
# keeps one writer per volume during a rollout. Moving the app means changing
# this key in all three files.
#
# Rakazo reads its settings at process start and rakazo-config has no name
# suffix hash, so a config change needs a rollout restart (docs/rakazo.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: &labels
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: rakazo-controller
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/hostname: drone-03
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: ghcr.io/elie222/rakazo/app:v0.12.0@sha256:0ede140417319081bf646c97768976aaf0643e07b8ca2970d43da789ecff3b82
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: BETTER_AUTH_SECRET
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: SCREEN_PROXY_SECRET
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: SMTP_URL
                  optional: true
            # OIDC client secret stays on the API only, per upstream: the worker
            # and web processes never receive it.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-oidc
                  key: OIDC_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          workingDir: /app/apps/api
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rakazo-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: &labels
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: rakazo-controller
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/hostname: drone-03
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: ghcr.io/elie222/rakazo/app:v0.12.0@sha256:0ede140417319081bf646c97768976aaf0643e07b8ca2970d43da789ecff3b82
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: ENCRYPTION_KEY
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: SMTP_URL
                  optional: true
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          workingDir: /app/apps/worker
          readinessProbe:
            exec:
              command:
                - node
                - dist/health-check.js
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      # Long grace: a stopping worker hands running turns back instead of
      # dropping them mid-turn.
      terminationGracePeriodSeconds: 3000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rakazo-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: &labels
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: ghcr.io/elie222/rakazo/app:v0.12.0@sha256:0ede140417319081bf646c97768976aaf0643e07b8ca2970d43da789ecff3b82
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 768Mi
              ephemeral-storage: 2Gi
          env:
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: SCREEN_PROXY_SECRET
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node_modules/.bin/vite
            - preview
            - --host
            - 0.0.0.0
            - --port
            - "5173"
          workingDir: /app/apps/web
          ports:
            - name: http
              containerPort: 5173
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: web-assets
              mountPath: /app/apps/web/asset-archive
      terminationGracePeriodSeconds: 60
      volumes:
        - name: web-assets
          persistentVolumeClaim:
            claimName: rakazo-web-assets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-local
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-assets
  labels:
    app.kubernetes.io/name: rakazo
    app.kubernetes.io/component: web
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-local
  resources:
    requests:
      storage: 2Gi
