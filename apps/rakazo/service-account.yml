---
# The controller identity: the API and worker impersonate it to create computer
# Pods in rakazo-sandboxes. The token is mounted on those two workloads only.
# Its authority is whatever the RoleBinding in apps/rakazo-sandboxes grants.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: rakazo
automountServiceAccountToken: true
