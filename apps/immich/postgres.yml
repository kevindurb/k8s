---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels: &labels
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # No fsGroup on purpose: kubelet re-applies group ownership on every
        # container start, which resets PGDATA to root-owned and breaks initdb.
        # The pgdata-perms init container sets ownership explicitly instead.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-volume
        # The image's entrypoint copies /var/postgresql-conf-tpl/postgresql.ssd.conf
        # into /etc/postgresql/postgresql.conf and seds PGDATA into it on every
        # start, so that directory has to be writable despite the read-only rootfs.
        - name: etc-postgresql
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: tmp
          emptyDir: {}
        - name: var-tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      initContainers:
        # The zvol arrives with a root-owned lost+found, and kubelet's fsGroup only
        # adds group ownership, so PGDATA has to be handed to uid 1000 explicitly.
        # Without this initdb (non-root) fails with EPERM on chmod of PGDATA.
        - name: pgdata-perms
          image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvector0.8.1@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
          command: ['sh', '-c', 'mkdir -p "$PGDATA" && chown 1000:1000 "$PGDATA" && chmod 700 "$PGDATA"']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvector0.8.1@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: '--data-checksums'
            - name: DB_STORAGE_TYPE
              value: SSD
          volumeMounts:
            # Mount the parent, not PGDATA itself: initdb refuses a mount point
            # containing lost+found, and PGDATA is /var/lib/postgresql/data.
            - name: data
              mountPath: /var/lib/postgresql
            - name: etc-postgresql
              mountPath: /etc/postgresql
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ['pg_isready', '--dbname=immich', '--username=immich']
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['pg_isready', '--dbname=immich', '--username=immich']
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-volume
  labels:
    app.kubernetes.io/component: postgres
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels: &labels
    app.kubernetes.io/component: postgres
spec:
  selector: *labels
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
