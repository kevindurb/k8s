---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich
namePrefix: immich-

resources:
  - ./server.yml
  - ./machine-learning.yml
  - ./postgres.yml
  - ./valkey.yml
  - ./data.yml
  - ./secret-sealed-secret.yml

# Deliberately no app-pod-hardening/app-tmp-dirs components: they only match
# app.kubernetes.io/component=app, and Immich's containers are labelled
# server/machine-learning/postgres/valkey. Each one carries its own explicit
# securityContext instead, because the server's upstream image expects to run
# with a writable root filesystem (unlike museum, whose rootfs can stay read-only).

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - immich.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: immich
