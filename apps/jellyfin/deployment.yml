---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  annotations:
    reloader.stakater.com/auto: "true"
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: Quadro-P620-SHARED
      securityContext:
        fsGroup: 1000
      volumes:
        - name: nas-media
          persistentVolumeClaim:
            claimName: nas-media
        - name: config
          persistentVolumeClaim:
            claimName: config-pvc
      # Runs the database migrations before the server container starts. Init
      # containers have no probes, so a long migration cannot be killed by the
      # app container's 5 minute startupProbe; the server then boots on an
      # already-migrated database. Jellyfin 12 rewrites the library database on
      # first boot and must not be interrupted.
      # Note: --mode only exists from 12.0 on. Revert this container together
      # with the image below.
      initContainers:
        # One-off repair. BaseItems has a row whose ChannelId is
        # '00000000-0000-0000-0000-00000000000\x10' (35 hex chars, not a GUID),
        # which aborts the 12.x 20260610120000_RefreshCleanNamesAndValues
        # migration with "Guid string should only contain hexadecimal
        # characters". Idempotent; drop it once the upgrade is through.
        - name: repair-db
          image: python:3.12-alpine@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
          command: ["python", "-c"]
          args:
            - |
              import os, sqlite3, sys
              db = "/config/data/jellyfin.db"
              if not os.path.exists(db) or os.path.getsize(db) == 0:
                  print("no database yet, nothing to repair")
                  sys.exit(0)
              con = sqlite3.connect(db)
              try:
                  cur = con.execute(
                      "UPDATE BaseItems"
                      " SET ChannelId = '00000000-0000-0000-0000-000000000000'"
                      " WHERE ChannelId IS NOT NULL AND ChannelId <> ''"
                      " AND NOT (length(ChannelId) = 36"
                      "   AND substr(ChannelId, 9, 1) = '-'"
                      "   AND substr(ChannelId, 14, 1) = '-'"
                      "   AND substr(ChannelId, 19, 1) = '-'"
                      "   AND substr(ChannelId, 24, 1) = '-'"
                      "   AND ChannelId NOT GLOB '*[^0-9a-fA-F-]*')"
                  )
                  print("rows repaired:", cur.rowcount)
              except sqlite3.OperationalError as exc:
                  print("skipping:", exc)
              con.commit()
              con.close()
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: migrate
          image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          args: ["--mode", "MigrateSystem"]
          securityContext:
            privileged: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          securityContext:
            privileged: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 1G
            limits:
              memory: 4G
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8096
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: 8096

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:media
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [jellyfin]
