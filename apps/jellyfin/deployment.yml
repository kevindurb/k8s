---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  annotations:
    reloader.stakater.com/auto: "true"
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      # Jellyfin transcodes on drone-03's Vega 11 (VA-API). There is no NVIDIA
      # runtime to request and no `nvidia.com/gpu` resource for a hostPath
      # device, so placement is a plain label and the node appears as /dev/dri.
      nodeSelector:
        media/gpu: amd-vega
      securityContext:
        fsGroup: 1000
      volumes:
        - name: nas-media
          persistentVolumeClaim:
            claimName: nas-media
        - name: config
          persistentVolumeClaim:
            claimName: config-pvc
        # The render nodes. /dev/dri is a hostPath, not a device plugin, so the
        # scheduler cannot enforce it: without this mount the pod starts fine and
        # silently falls back to software transcoding.
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        # Jellyfin's transcodes and image cache default to /cache; without a
        # volume they land on the container's writable layer, i.e. the node's
        # root filesystem. Pod-scoped here, and counted as ephemeral storage.
        - name: cache
          emptyDir: {}
      # Jellyfin runs database migrations before the server serves traffic, and
      # a migration that outlives the app container's 5 minute startupProbe is
      # killed halfway. Init containers have no probes, so migrate here first
      # and let the server boot on an already-migrated database. Same image as
      # the server below; bump the two together.
      initContainers:
        - name: migrate
          image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          args: ["--mode", "MigrateSystem"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          securityContext:
            privileged: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: nas-media
              mountPath: /media
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              memory: 1G
            limits:
              memory: 4G
          ports:
            - name: http
              containerPort: 8096
          # The startupProbe covers boot and migrations; readiness and liveness
          # do not run until it succeeds, so they need no initial delay.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: 8096

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:media
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [jellyfin]
