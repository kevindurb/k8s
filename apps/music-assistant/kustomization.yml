---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: music-assistant
namePrefix: music-assistant-

resources:
  - ./deployment.yml

components:
  - ../../components/storage-home-drone-01
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
  - ../../components/nas-media

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - music-assistant.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: music-assistant
