---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      containers:
        - name: app
          image: docker.io/itzg/minecraft-server:java25@sha256:f7f2222512810f0f0e85133913622cf639be77a5dd1d4b11f24ab675da6ba742
          env:
            - name: TZ
              value: America/Denver
            - name: EULA
              value: 'TRUE'
            - name: TYPE
              value: PAPER
            - name: MEMORY
              value: 3G
            # Bedrock cross-play: Geyser translates the protocol, Floodgate lets Bedrock players join without a Java account
            - name: PLUGINS
              value: |-
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
                https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
            # Large builds: pre-generated .schem files pasted with WorldEdit (see .claude/skills/minecraft-builder)
            - name: MODRINTH_PROJECTS
              value: worldedit
            # WorldEdit's latest Modrinth versions are betas; without this the version
            # resolver finds no "release" candidate and container exits (see CrashLoop 2026-10-12)
            - name: MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE
              value: beta
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 3Gi
            limits:
              memory: 4Gi
          ports:
            - name: java
              containerPort: 25565
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: java
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: java
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: java
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
  annotations:
    tailscale.com/hostname: minecraft
    tailscale.com/tags: tag:games
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector: *labels
  ports:
    - name: java
      port: 25565
      targetPort: java
      protocol: TCP
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 10Gi
