---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: plugins
          persistentVolumeClaim:
            claimName: plugins
        - name: html
          emptyDir: {}
      containers:
        - name: app
          image: docker.io/roundcube/roundcubemail:1.7.x-apache-nonroot
          env:
            - name: TZ
              value: America/Denver
            - name: ROUNDCUBEMAIL_DB_TYPE
              value: sqlite
            - name: ROUNDCUBEMAIL_SKIN
              value: elastic
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: ssl://imap.fastmail.com
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: '993'
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: ssl://smtp.fastmail.com
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: '465'
          envFrom: []
          volumeMounts:
            - name: config
              mountPath: /var/roundcube
            - name: html
              mountPath: /var/www/html
            - name: plugins
              mountPath: /var/www/html/plugins
          resources:
            requests:
              memory: 128M
            limits:
              memory: 256M
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          ports:
            - name: http
              containerPort: 8000

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plugins
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s,tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [roundcube]
