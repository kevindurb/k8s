---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  selfhosted.yaml: |
    name: "selfhosted"
    is_done_tick_dot_com: false
    is_user_creation_disabled: false
    disable_password_auth: true
    database:
      type: "sqlite"
      migration: true
    jwt:
      secret: ""
      session_time: 168h
      max_refresh: 1440h
    server:
      port: 2021
      read_timeout: 10s
      write_timeout: 10s
      rate_period: 60s
      rate_limit: 300
      cors_allow_origins:
        - "https://donetick.beaver-cloud.ts.net"
        - "https://localhost"
        - "http://localhost"
        - "capacitor://localhost"
      serve_frontend: true
      serve_swagger: true
      public_host: "https://donetick.beaver-cloud.ts.net"
    logging:
      level: "info"
      encoding: "json"
      development: false
    scheduler_jobs:
      due_job: 30m
      overdue_job: 3h
      pre_due_job: 3h
    oauth2:
      # Pocket ID client "donetick"; the secret comes from
      # DT_OAUTH2_CLIENT_SECRET in the donetick-secrets SealedSecret.
      client_id: "donetick"
      client_secret: ""
      # PKCE (S256) on the OIDC flow; donetick >= 0.1.83 generates the
      # challenge in its frontend when this is set. The Pocket ID client
      # "donetick" must have PKCE enabled too, otherwise it silently accepts
      # the challenge without requiring one.
      pkce: true
      scopes:
        - "openid"
        - "profile"
        - "email"
      auth_url: "https://idp.beaver-cloud.ts.net/authorize"
      token_url: "https://idp.beaver-cloud.ts.net/api/oidc/token"
      user_info_url: "https://idp.beaver-cloud.ts.net/api/oidc/userinfo"
      redirect_url: "https://donetick.beaver-cloud.ts.net/auth/oauth2"
      name: "Pocket ID"
    storage:
      storage_type: "local"
      base_path: "/donetick-data/uploads"
      max_user_storage: 5368709120
      max_file_size: 5242880
    realtime:
      enabled: true
      sse_enabled: true
      allowed_origins:
        - "*"
