---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: donetick
namePrefix: donetick-
resources:
  - ./deployment.yml
  - ./config.yml
  - ./secrets-sealed-secret.yml
components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - donetick.yml=gatus.yml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: donetick
