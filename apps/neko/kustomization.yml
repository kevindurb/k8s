---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neko
namePrefix: neko-
resources:
  - ./deployment.yml
  - ./neko-tsidp-sealed-secret.yml
components:
  # WebRTC EPR ports must be reachable on the node's IP, so run hostNetwork.
  - ../../components/host-networking
  # Persistent Firefox profile (app-volume PVC -> /home/neko/.mozilla).
  - ../../components/app-volume
configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - neko.yml=gatus.yml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: neko
