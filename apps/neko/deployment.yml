---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  annotations:
    reloader.stakater.com/auto: 'true'
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      # kubelet group-owns mounted volumes for the `neko` user (uid/gid 1000)
      # so firefox can write the profile volume without an init-container chown
      securityContext:
        fsGroup: 1000
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: app-volume
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        # The neko image's supervisord starts as root and drops privileges to
        # the `neko` user per program, so it cannot use the pod-hardening
        # component (runAsNonRoot) and stays reachable only on the tailnet.
        - name: app
          image: ghcr.io/m1k1o/neko/firefox:3@sha256:f832b3e28492b9cc10f702cc9feb9da462320502944fc0ddbddbcab352428e02
          env:
            - name: TZ
              value: America/Denver
            - name: NEKO_SERVER_BIND
              value: ':8080'
            - name: NEKO_DESKTOP_SCREEN
              value: 1920x1080@30
            # WebRTC media does not go through the Ingress: UDP EPR ports are
            # bound directly on the node via the host-networking component (no
            # containerPorts declared for them, the range is bound host-wide).
            - name: NEKO_WEBRTC_EPR
              value: 52000-52100
            # Advertise the node IP as ICE candidate so clients connect to the
            # host directly (works on the LAN; remote tailnet clients need a
            # TURN server or the node's tailscale IP instead).
            - name: NEKO_WEBRTC_NAT1TO1
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NEKO_WEBRTC_ICELITE
              value: 'true'
            # Auth via tsidp (Tailscale OIDC). Client ID/secret live in the
            # neko-tsidp SealedSecret; redirect URL registered on the IdP:
            # https://neko.beaver-cloud.ts.net/api/oauth/callback
            # No admin_emails: every authenticated tailnet user is a regular
            # user (can_watch/can_host) and the admin console stays unused.
            - name: NEKO_MEMBER_PROVIDER
              value: oauth
            - name: NEKO_MEMBER_OAUTH_ISSUER_URL
              value: https://idp.beaver-cloud.ts.net
            - name: NEKO_MEMBER_OAUTH_NAME
              value: tsidp
            - name: NEKO_MEMBER_OAUTH_SCOPES
              value: '["openid","profile","email"]'
            - name: NEKO_MEMBER_OAUTH_AUTO_REDIRECT
              value: 'true'
            # tsidp userinfo exposes the login local part as `username`
            - name: NEKO_MEMBER_OAUTH_USERNAME_FIELD
              value: username
            - name: NEKO_MEMBER_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: neko-tsidp
                  key: OIDC_CLIENT_ID
            - name: NEKO_MEMBER_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: neko-tsidp
                  key: OIDC_CLIENT_SECRET
            # trust X-Forwarded-* from the tailscale ingress proxy when deriving
            # the OAuth redirect URL
            - name: NEKO_SERVER_PROXY
              value: 'true'
          volumeMounts:
            - name: profile
              mountPath: /home/neko/.mozilla/firefox/profile.default
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: '4'
              memory: 4Gi
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s,tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [neko]
