---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob
  labels: &labels
    app.kubernetes.io/component: app
spec:
  suspend: false
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: *labels
        spec:
          volumes:
            - name: nas-media
              persistentVolumeClaim:
                claimName: nas-media
            - name: config-tmp
              emptyDir: {}
            - name: config
              configMap:
                name: config
            - name: cookie
              secret:
                secretName: cookie
          restartPolicy: Never
          containers:
            - name: ytdl-sub
              image: ghcr.io/jmbannon/ytdl-sub:2026.07.17.post1@sha256:e9b85582689e0e70122faabaa751a651e23a0729c8c15e11af90aee32d501842
              command:
                - ytdl-sub
                - --config
                - /config/config.yml
                - sub
                - /config/subscriptions.yml
              resources:
                requests:
                  memory: 100M
                limits:
                  memory: 4G
              volumeMounts:
                - name: nas-media
                  mountPath: /media
                - name: config-tmp
                  mountPath: /config
                - name: cookie
                  mountPath: /config/cookie.txt
                  subPath: cookie.txt
                  readOnly: true
                - name: config
                  mountPath: /config/subscriptions.yml
                  subPath: subscriptions.yml
                  readOnly: true
                - name: config
                  mountPath: /config/config.yml
                  subPath: config.yml
                  readOnly: true
              env:
                - name: TZ
                  value: America/Denver

---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: cookie
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: app
spec:
  organizationId: 575f69b2-49f4-456d-bd6f-b14101103188
  secretName: ts-auth-key
  map:
    - secretKeyName: cookie.txt
      bwSecretId: e3eadbbf-ab9a-4491-80d7-b4a501450131
  authToken:
    secretName: bw-auth-token
    secretKey: token
