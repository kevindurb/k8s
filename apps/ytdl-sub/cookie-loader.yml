---
apiVersion: v1
kind: Pod
metadata:
  name: cookie-loader
  namespace: ytdl-sub
spec:
  restartPolicy: Never
  containers:
    - name: cookie-loader
      image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      command: ["sleep", "3600"]
      volumeMounts:
        - name: config
          mountPath: /config
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: ytdl-sub-config
