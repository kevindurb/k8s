---
# wger does not serve static files itself (DEBUG=False, no WhiteNoise), so nginx
# runs in the same pod as gunicorn. Both share the collected-static emptyDir and
# the media PVC, which is why they cannot be separate Deployments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: static
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      initContainers:
        # wger's entrypoint exits when the database is unreachable, so wait for
        # PostgreSQL instead of relying on a restart loop.
        - name: wait-for-db
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - until nc -z wger-postgres-service 5432; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests:
              memory: 16M
            limits:
              memory: 64M
      containers:
        - name: app
          image: docker.io/wger/server:2.7.0@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
          env:
            - name: TZ
              value: America/Denver
            - name: TIME_ZONE
              value: America/Denver
            - name: SITE_URL
              value: https://wger.beaver-cloud.ts.net
            - name: CSRF_TRUSTED_ORIGINS
              value: https://wger.beaver-cloud.ts.net
            # The Tailscale proxy terminates TLS and sets X-Forwarded-Proto;
            # nginx forwards it so Django builds https:// URLs.
            - name: X_FORWARDED_PROTO_HEADER_SET
              value: 'True'
            - name: DJANGO_DEBUG
              value: 'False'
            - name: WGER_USE_GUNICORN
              value: 'True'
            - name: ALLOW_REGISTRATION
              value: 'False'
            - name: ALLOW_GUEST_USERS
              value: 'False'
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: SECRET_KEY
            - name: DJANGO_DB_ENGINE
              value: django.db.backends.postgresql
            - name: DJANGO_DB_DATABASE
              value: wger
            - name: DJANGO_DB_USER
              value: wger
            - name: DJANGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: POSTGRES_PASSWORD
            - name: DJANGO_DB_HOST
              value: wger-postgres-service
            - name: DJANGO_DB_PORT
              value: '5432'
            # Email goes through Celery so password resets never block a request.
            - name: USE_CELERY
              value: 'True'
            - name: CELERY_BROKER
              value: redis://wger-redis-service:6379/2
            - name: CELERY_BACKEND
              value: redis://wger-redis-service:6379/2
            - name: ENABLE_EMAIL
              value: 'True'
            - name: EMAIL_HOST
              value: smtp-relay-app-service.smtp-relay
            - name: EMAIL_PORT
              value: '25'
            - name: EMAIL_USE_TLS
              value: 'False'
            - name: EMAIL_HOST_USER
              value: ''
            - name: EMAIL_HOST_PASSWORD
              value: ''
            - name: FROM_EMAIL
              value: wger Workout Manager <beavercloud@fastmail.com>
            # The Pocket ID provider row is seeded once from these values.
            - name: WGER_SOCIAL_PROVIDERS
              value: openid_connect
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: OIDC_CLIENT_SECRET
            # Bootstrap local-admin password, read only by the one-time
            # `manage.py shell` reset documented in kustomization.yml.
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: ADMIN_PASSWORD
            # Requests reach nginx through the Tailscale proxy: two hops in the
            # X-Forwarded-For chain. nginx sets X-Real-IP to the proxy address,
            # so django-axes must read the forwarded chain instead.
            - name: NUMBER_OF_PROXIES
              value: '2'
            - name: AXES_IPWARE_PROXY_COUNT
              value: '1'
            - name: AXES_IPWARE_META_PRECEDENCE_ORDER
              value: HTTP_X_FORWARDED_FOR,REMOTE_ADDR
          volumeMounts:
            - name: media
              mountPath: /home/wger/media
            - name: static
              mountPath: /home/wger/static
          resources:
            requests:
              memory: 512M
            limits:
              memory: 1G
          ports:
            - name: gunicorn
              containerPort: 8000
          # First boot runs migrations, fixtures and collectstatic, so allow up
          # to five minutes before the startup probe starts failing.
          startupProbe:
            httpGet:
              path: /api/v2/version/
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v2/version/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/version/
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: static
              mountPath: /wger/static
              readOnly: true
            - name: media
              mountPath: /wger/media
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 16M
            limits:
              memory: 64M
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v2/version/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
        # Celery worker sidecar, not a separate Deployment: it writes exercise
        # media to the same ReadWriteOnce volume the app mounts, and RWO
        # volumes attach to one node at a time. Keeping it in this pod mirrors
        # the linkding worker and makes the two mount from the same node.
        - name: celery-worker
          image: docker.io/wger/server:2.7.0@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
          command: ['/start-worker']
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: America/Denver
            - name: TIME_ZONE
              value: America/Denver
            - name: DJANGO_DEBUG
              value: 'False'
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: SECRET_KEY
            - name: DJANGO_DB_ENGINE
              value: django.db.backends.postgresql
            - name: DJANGO_DB_DATABASE
              value: wger
            - name: DJANGO_DB_USER
              value: wger
            - name: DJANGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: POSTGRES_PASSWORD
            - name: DJANGO_DB_HOST
              value: wger-postgres-service
            - name: DJANGO_DB_PORT
              value: '5432'
            - name: USE_CELERY
              value: 'True'
            - name: CELERY_BROKER
              value: redis://wger-redis-service:6379/2
            - name: CELERY_BACKEND
              value: redis://wger-redis-service:6379/2
            # Gevent pool; two concurrent jobs is plenty for one user.
            - name: CELERY_WORKER_CONCURRENCY
              value: '2'
            # The beat schedules these weekly, at a random day and time.
            - name: SYNC_EXERCISES_CELERY
              value: 'True'
            - name: SYNC_EXERCISE_IMAGES_CELERY
              value: 'True'
            - name: SYNC_EXERCISE_VIDEOS_CELERY
              value: 'True'
            - name: SYNC_INGREDIENTS_CELERY
              value: 'True'
          volumeMounts:
            - name: media
              mountPath: /home/wger/media
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: run
              mountPath: /run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            # Video sync downloads each file into memory before saving it; the
            # largest current exercise video is about 423 MiB.
            requests:
              memory: 512M
            limits:
              memory: 2G
          startupProbe:
            exec:
              command: ['celery', '-A', 'wger', 'inspect', 'ping']
            periodSeconds: 20
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ['celery', '-A', 'wger', 'inspect', 'ping']
            initialDelaySeconds: 30
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ['celery', '-A', 'wger', 'inspect', 'ping']
            initialDelaySeconds: 120
            periodSeconds: 60

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:apps
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [wger]
