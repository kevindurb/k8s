---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels: &labels
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-volume
        - name: tmp
          emptyDir: {}
        - name: var-tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      containers:
        - name: app
          image: docker.io/library/postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wger-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: wger
            - name: POSTGRES_DB
              value: wger
          volumeMounts:
            # postgres 18 keeps its data root at /var/lib/postgresql, not
            # /var/lib/postgresql/data.
            - name: data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: var-run
              mountPath: /var/run
            - name: var-cache
              mountPath: /var/cache
            - name: var-log
              mountPath: /var/log
          resources:
            requests:
              memory: 128M
            limits:
              memory: 1G
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ['pg_isready', '--dbname=wger', '--username=wger']
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['pg_isready', '--dbname=wger', '--username=wger']
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['pg_isready', '--dbname=wger', '--username=wger']
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-volume
  labels:
    app.kubernetes.io/component: postgres
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels: &labels
    app.kubernetes.io/component: postgres
spec:
  selector: *labels
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
