---
# Celery broker and Django cache only. Losing this volume loses queued jobs and
# cache entries, never user data, so it is an emptyDir with persistence off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels: &labels
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: app
          image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
          args: ['valkey-server', '--save', '', '--appendonly', 'no']
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: America/Denver
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 64M
            limits:
              memory: 256M
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: ['valkey-cli', '-p', '6379', 'ping']
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['valkey-cli', '-p', '6379', 'ping']
            initialDelaySeconds: 20
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: &labels
    app.kubernetes.io/component: redis
spec:
  selector: *labels
  ports:
    - name: redis
      port: 6379
      targetPort: redis
