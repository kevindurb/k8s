upstream wger {
    server 127.0.0.1:8000;
}

# Preserve the scheme the Tailscale proxy forwarded, falling back to this
# server's own scheme when it did not set the header.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;

    client_max_body_size 100M;

    location / {
        proxy_pass http://wger;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Files without a content hash can change between releases: revalidate.
    # Hashed assets (collectstatic) are immutable.
    location /static/ {
        root /wger;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;

        location ~ "\.[0-9a-f]{12}\.[^./]+$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }
    }

    location /media/ {
        alias /wger/media/;
    }
}
