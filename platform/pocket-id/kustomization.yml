---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id
namePrefix: pocket-id-
resources:
  - ./deployment.yml
  - ./pocket-id-sealed-secret.yml
components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - pocket-id.yml=gatus.yml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: pocket-id
