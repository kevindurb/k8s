---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        # Ansible writes to $HOME (.ansible/tmp, known_hosts) and the image's
        # root filesystem is read-only under the hardened securityContext, so
        # give the app a writable home directory.
        - name: home
          emptyDir: {}
      containers:
        - name: app
          image: docker.io/semaphoreui/semaphore:v2.20.0-alpha4@sha256:19b8769d95849418104bf51eca0dfd4559f76eab7b89030bf88c7531465b27f1
          env:
            - name: TZ
              value: America/Denver
            - name: HOME
              value: /home/semaphore
            # SQLite DB and config.json live together on the PVC so the admin
            # bootstrap (SEMAPHORE_ADMIN*) only runs on first boot.
            - name: SEMAPHORE_CONFIG_PATH
              value: /var/lib/semaphore
            - name: SEMAPHORE_DB_DIALECT
              value: sqlite
            - name: SEMAPHORE_DB_PATH
              value: /var/lib/semaphore
            - name: SEMAPHORE_TMP_PATH
              value: /tmp/semaphore
            - name: SEMAPHORE_WEB_ROOT
              value: https://semaphore.beaver-cloud.ts.net
            # Bootstrap-only (runs when the DB is empty). Keep this address
            # different from any tsidp identity's email: Semaphore matches an
            # OIDC login to an existing user by email and refuses to link a
            # local password account, so a shared address breaks SSO.
            - name: SEMAPHORE_ADMIN
              value: admin
            - name: SEMAPHORE_ADMIN_NAME
              value: Kevin
            - name: SEMAPHORE_ADMIN_EMAIL
              value: admin@beaver-cloud.ts.net
            - name: SEMAPHORE_TOTP_ENABLED
              value: 'true'
            # Stop Python from trying to write __pycache__ into the read-only venv.
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: SEMAPHORE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semaphore-secret
                  key: SEMAPHORE_ADMIN_PASSWORD
            - name: SEMAPHORE_ACCESS_KEY_ENCRYPTION
              valueFrom:
                secretKeyRef:
                  name: semaphore-secret
                  key: SEMAPHORE_ACCESS_KEY_ENCRYPTION
            - name: SEMAPHORE_OIDC_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: semaphore-secret
                  key: SEMAPHORE_OIDC_PROVIDERS
          volumeMounts:
            - name: data
              mountPath: /var/lib/semaphore
            - name: home
              mountPath: /home/semaphore
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 256M
            limits:
              memory: 2G
          ports:
            - name: http
              containerPort: 3000

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    app.kubernetes.io/component: app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-generic-nvmeof-csi
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels: &labels
    app.kubernetes.io/component: app
spec:
  selector: *labels
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:k8s
spec:
  defaultBackend:
    service:
      name: app-service
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [semaphore]
