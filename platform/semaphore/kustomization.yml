---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: semaphore
namePrefix: semaphore-

resources:
  - ./deployment.yml
  - ./secret-sealed-secret.yml

components:
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - semaphore.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: semaphore
