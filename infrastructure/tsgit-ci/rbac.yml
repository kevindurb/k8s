apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsgit-ci
---
# Identity for task pods. No roles at all; token never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
automountServiceAccountToken: false
---
# Lets the tsgit EventListener resolve EventListener/Trigger/TriggerBinding/
# TriggerTemplate objects and create PipelineRuns. Provided by the Tekton
# Triggers install (see infrastructure/tekton).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsgit-ci-eventlistener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: tsgit-ci
    namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tsgit-ci-eventlistener
subjects:
  - kind: ServiceAccount
    name: tsgit-ci
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
# The prune job may delete PipelineRuns older than the retention window.
# Nothing else in this app talks to the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tsgit-ci-prune
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsgit-ci-prune
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tsgit-ci-prune
subjects:
  - kind: ServiceAccount
    name: tsgit-ci
