---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsgit-ci
---
# Identity for task pods. No roles at all; token never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
automountServiceAccountToken: false
---
# The poller may create and read PipelineRuns; nothing else. Pipelines run
# as their own workloads and never touch the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tsgit-ci-poller
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsgit-ci-poller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tsgit-ci-poller
subjects:
  - kind: ServiceAccount
    name: tsgit-ci
