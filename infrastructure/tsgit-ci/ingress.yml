# tsgit's push webhook reaches the cluster as a tailnet service, reachable
# only by tag:tsgit (see the kevindurb/infra tailnet policy: tag:tsgit-hooks).
# The tailscale operator creates the proxy and the *.beaver-cloud.ts.net cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tsgit-hooks
  annotations:
    tailscale.com/tags: tag:tsgit-hooks
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: el-tsgit-hooks
      port:
        number: 8080
  tls:
    - hosts: [tsgit-hooks]
