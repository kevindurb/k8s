---
# Pipelines and Tasks for tsgit-hosted repositories. Plain tekton.dev/v1.
# No remote resolvers: everything is inline so the controller never needs
# network access to a task catalog.

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone
  namespace: tekton-pipelines
spec:
  description: Shallow-fetch one revision of a repository into the workspace.
  params:
    - name: repo
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  steps:
    - name: git-clone
      image: alpine/git:2.54.1@sha256:29cff25811f790b9f72fc266bf8009a5a911714c0e03c31c47339c50909d9aef
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        # git refuses to touch the root-owned workspace without this; the
        # pod is ephemeral and isolated, so '*' is acceptable here.
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: "*"
      script: |
        #!/bin/sh
        set -eu
        cd "$(workspaces.source.path)"
        git init -q
        git remote add origin "$(params.repo)"
        # tsgit serves arbitrary reachable SHAs. Build exactly the pinned
        # revision or fail loudly - never silently build a different one.
        git fetch --depth 1 origin "$(params.revision)"
        git checkout -q --detach FETCH_HEAD
        echo "cloned at $(git rev-parse HEAD)"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-chezmoi
  namespace: tekton-pipelines
spec:
  description: Download the pinned chezmoi binary (sha256-verified) into the tools workspace.
  workspaces:
    - name: tools
  steps:
    - name: fetch
      image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      script: |
        #!/bin/sh
        set -eu
        base=https://github.com/twpayne/chezmoi/releases/download/v2.74.2
        file=chezmoi_2.74.2_linux_amd64.tar.gz
        want=5f2024119a1860f18f2243b892dd43a79f0fefe2ebef9786ee143f4d5fd69ccb
        cd "$(workspaces.tools.path)"
        curl -fsSL -o "$file" "$base/$file"
        echo "$want  $file" | sha256sum -c -
        tar xzf "$file"
        rm "$file"
        chmod 755 chezmoi

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dotfiles-check
  namespace: tekton-pipelines
spec:
  description: >-
    Dry-run apply (renders every template that applies on Linux) plus render-and-shellcheck
    for every *.sh.tmpl and plain *.sh in a chezmoi source tree.
  workspaces:
    - name: source
    - name: tools
  steps:
    - name: check
      image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: HOME
          value: $(workspaces.tools.path)/home
        - name: PATH
          value: $(workspaces.tools.path):/usr/local/bin:/usr/local/sbin:/usr/bin:/bin
      script: |
        #!/bin/sh
        set -eu
        SRC="$(workspaces.source.path)"
        TOOLS="$(workspaces.tools.path)"
        cd "$SRC"
        echo "== chezmoi dry-run apply"
        chezmoi --source "$SRC" --destination "$TOOLS/target" apply --dry-run --verbose
        echo "== render + shellcheck *.sh.tmpl"
        find . -type f -name '*.sh.tmpl' -print | while IFS= read -r f; do
          echo "-- $f"
          chezmoi --source "$SRC" execute-template < "$f" | shellcheck -s bash -
        done
        echo "== shellcheck plain *.sh"
        find . -path ./.git -prune -o -type f -name '*.sh' -print | while IFS= read -r f; do
          echo "-- $f"
          shellcheck -s bash "$f"
        done
        echo "dotfiles-check: OK"

---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: validate-repo
  namespace: tekton-pipelines
spec:
  description: Clone a repo and validate it. First pipeline for tsgit-hosted repos.
  params:
    - name: repo
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
    - name: tools
  tasks:
    - name: fetch-chezmoi
      taskRef:
        name: fetch-chezmoi
      workspaces:
        - name: tools
          workspace: tools
    - name: clone
      taskRef:
        name: clone
      params:
        - name: repo
          value: $(params.repo)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: checks
      taskRef:
        name: dotfiles-check
      runAfter: [fetch-chezmoi, clone]
      workspaces:
        - name: source
          workspace: source
        - name: tools
          workspace: tools
