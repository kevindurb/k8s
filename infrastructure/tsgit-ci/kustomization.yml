---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tekton-pipelines

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tsgit-poll-repos
    files:
      - repos=repos.txt
  - name: tsgit-poll-script
    files:
      - poll.sh
    options:
      disableNameSuffixHash: true

resources:
  - rbac.yml
  - poller.yml
  - prune.yml

labels:
  - includeSelectors: false
    includeTemplates: false
    pairs:
      app.kubernetes.io/part-of: tsgit-ci
