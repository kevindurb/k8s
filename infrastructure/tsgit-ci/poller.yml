---
# Polls tsgit for new commits (no webhooks exist) and creates a PipelineRun
# per changed repo. State is one file per repo on the PVC; loss of state
# causes at most one duplicate build per repo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tsgit-poll-state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tsgit-poll
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: tsgit-ci
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poller
              image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "/poll.sh"]
              env:
                - name: NS
                  value: tekton-pipelines
              volumeMounts:
                - name: script
                  mountPath: /poll.sh
                  subPath: poll.sh
                  readOnly: true
                - name: repos
                  mountPath: /etc/tsgit-poll
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: tsgit-poll-script
                defaultMode: 292 # 0444
            - name: repos
              configMap:
                name: tsgit-poll-repos
            - name: state
              persistentVolumeClaim:
                claimName: tsgit-poll-state
            - name: tmp
              emptyDir: {}
