---
# Polls tsgit for new commits (no webhooks exist) and creates a PipelineRun
# per changed repo. State is one file per repo on the PVC; loss of state
# causes at most one duplicate build per repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsgit-poll-repos
data:
  repos: |
    # name  url                                                                   branch
    dotfiles https://tsgit.beaver-cloud.ts.net/kevindurb/dotfiles.git main
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsgit-poll-script
data:
  poll.sh: |
    #!/bin/sh
    set -eu

    REPOS_FILE=/etc/tsgit-poll/repos
    STATE=/state
    API=https://kubernetes.default.svc
    NS="${NS:-tekton-pipelines}"
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    mkdir -p "$STATE"

    while read -r name url branch _; do
      case "${name:-}" in
        ''|\#*) continue ;;
      esac
      case "$name" in
        *[!a-z0-9-]*) echo "poll: skipping invalid repo name '$name'"; continue ;;
      esac
      branch=${branch:-main}
      ref="refs/heads/$branch"

      body=$(curl -fsS --retry 3 --max-time 20 "$url/info/refs?service=git-upload-pack") || {
        echo "poll: $name: ls-remote HTTP fetch failed; skipping"
        continue
      }
      # pkt-line framing: strip the 4-hex length prefix of each line, then
      # pick the exact branch ref line. Tolerates refs longer than 40 hex (sha256 oids).
      sha=$(printf '%s' "$body" | tr -d '\r' | sed -e 's/^[0-9a-fA-F]\{4\}//' | awk -v ref="$ref" '$2 == ref {print $1}' | head -1)
      if [ -z "$sha" ]; then
        echo "poll: $name: ref $ref not advertised or unparsable"
        continue
      fi

      state_file="$STATE/$name.sha"
      last=$(cat "$state_file" 2>/dev/null || true)
      if [ "$sha" = "$last" ]; then
        echo "poll: $name @ $branch unchanged ($sha)"
        continue
      fi
      echo "poll: $name @ $branch ${last:-<none>} -> $sha, creating PipelineRun"

      payload=$(cat <<JSON
    {"apiVersion":"tekton.dev/v1","kind":"PipelineRun","metadata":{"generateName":"${name}-","namespace":"$NS","labels":{"ci.tsgit/repo":"$name","ci.tsgit/branch":"$branch"},"annotations":{"ci.tsgit/revision":"$sha"}},"spec":{"pipelineRef":{"name":"validate-repo"},"taskRunTemplate":{"serviceAccountName":"pipeline-runner","podTemplate":{"automountServiceAccountToken":false}},"params":[{"name":"repo","value":"$url"},{"name":"revision","value":"$sha"}],"workspaces":[{"name":"source","emptyDir":{}},{"name":"tools","emptyDir":{}}],"timeouts":{"pipeline":"10m","tasks":"9m"}}}
    JSON
    )
      code=$(curl -s -o /tmp/resp -w '%{http_code}' --cacert "$CACERT" \
        -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
        -X POST "$API/apis/tekton.dev/v1/namespaces/$NS/pipelineruns" \
        --data "$payload")
      case "$code" in
        2*) printf '%s\n' "$sha" > "$state_file"; echo "poll: $name PipelineRun created" ;;
        *)  echo "poll: $name failed to create PipelineRun (HTTP $code): $(cat /tmp/resp)"; exit 1 ;;
      esac
    done < "$REPOS_FILE"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tsgit-poll-state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tsgit-poll
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: tsgit-ci
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poller
              image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "/poll.sh"]
              env:
                - name: NS
                  value: tekton-pipelines
              volumeMounts:
                - name: script
                  mountPath: /poll.sh
                  subPath: poll.sh
                  readOnly: true
                - name: repos
                  mountPath: /etc/tsgit-poll
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: tsgit-poll-script
                defaultMode: 292 # 0444
            - name: repos
              configMap:
                name: tsgit-poll-repos
            - name: state
              persistentVolumeClaim:
                claimName: tsgit-poll-state
            - name: tmp
              emptyDir: {}
