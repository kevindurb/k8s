---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system

resources:
  - ./nodes.yml
  - ./storage-class.yml
  - ./limit-range.yml
  - ./jobs.yml
  - ./backup-target.yml
  - ./ingress.yml

configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - longhorn.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: longhorn-system
