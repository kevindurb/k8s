---
# k3s CoreDNS imports /etc/coredns/custom/*.override from this optional
# ConfigMap. Sending the tsidp name to the in-cluster egress Service means
# pods keep their configs unchanged, while the tailnet sees the oidc-egress
# ProxyGroup (tag:k8s-oidc) as the caller instead of tag:k8s-node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  tailnet.override: |
    rewrite stop {
      name exact idp.beaver-cloud.ts.net idp.tailscale.svc.cluster.local
      answer auto
    }
