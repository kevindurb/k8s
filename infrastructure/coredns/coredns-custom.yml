---
# k3s CoreDNS imports /etc/coredns/custom/*.override from this optional
# ConfigMap. Sending a tailnet name to an in-cluster egress Service means pods
# keep their configs unchanged, while the tailnet sees the egress ProxyGroup as
# the caller instead of tag:k8s-node:
#   idp.beaver-cloud.ts.net -> ProxyGroup oidc-egress (tag:k8s-oidc)
#   ai.beaver-cloud.ts.net  -> ProxyGroup ai-egress   (tag:k8s-ai)
#
# One single-line rule on purpose: plugin/rewrite rejects a block holding more
# than one `name exact` rule ("exceeded the number of arguments"), which
# crash-loops CoreDNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  tailnet.override: |
    rewrite stop name regex ^(idp|ai)\.beaver-cloud\.ts\.net$ {1}.tailscale.svc.cluster.local answer auto
