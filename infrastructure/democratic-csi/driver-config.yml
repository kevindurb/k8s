---
driver: zfs-generic-nvmeof
sshConnection:
  host: 192.168.42.24
  username: core
zfs:
  cli:
    sudoEnabled: true
  datasetParentName: rust/k8s/volumes
  detachedSnapshotsDatasetParentName: rust/k8s/snapshots
  zvolCompression: lz4
  zvolDedup: false
  zvolEnableReservation: false
  zvolBlocksize: 16K
nvmeof:
  # nr-io-queues=1: nodes that are also the target (drone-04 loopback) fail to connect >1 I/O queue (-EXDEV, kernel 7.2.5);
  # one queue is plenty on 1GbE.
  transports:
    - tcp://192.168.42.24:4420?nr-io-queues=1
  shareStrategy: "nvmetCli"
  shareStrategyNvmetCli:
    basename: "nqn.2003-01.org.linux-nvme"
    ports:
      - "1"
    subsystem:
      attributes:
        allow_any_host: 1
    sudoEnabled: true
    configIsImportedFilePath: /var/run/nvmet-config-loaded
