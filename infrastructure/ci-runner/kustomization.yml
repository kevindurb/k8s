---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ci-runner

# No namePrefix: the VM is a singleton and the sealed secret name must stay
# stable for the docs/rotation runbook.
resources:
  - vm.yaml
  - sealed-secret.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: ci-runner
