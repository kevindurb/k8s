---
# KubeVirt VM running the Forgejo Actions runner. The root disk is an
# ephemeral overlay on the ci-runner containerDisk image; state does not
# survive VM recreation (by design — see openspec add-forgejo-runner).
# No live-migration pin is set: the KubeVirt default (LiveMigrate, since the
# containerDisk is migratable) applies, which keeps node drains quick.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ci-runner
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: ci-runner
        app.kubernetes.io/name: ci-runner
    spec:
      hostname: ci-runner
      terminationGracePeriodSeconds: 30
      # Drones only: no control-plane tolerations, and drone-04 is excluded
      # (it is dedicated to storage and tainted NoSchedule).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - drone-01
                      - drone-02
                      - drone-03
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              model:
                type: virtio
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            # Pinned to the 2026.11.27 image (qcow2 built from
            # ghcr.io/kevindurb/ci-runner:latest @ sha256:e323405a...).
            # Digest fcc22bca02fc25e907b1d00a78e22924a1423b84a39ecae7f6ac595549066113
            # Built by .github/workflows/build-runner-disk.yml in kevindurb/bootc.
            # Never use a floating tag here; bump deliberately.
            image: ghcr.io/kevindurb/ci-runner-disk:2026.11.27
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: ci-runner-cloudinit
