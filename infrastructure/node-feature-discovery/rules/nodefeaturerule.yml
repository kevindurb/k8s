---
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: amd-vega-gpu
spec:
  rules:
    # Matches on raw PCI features, not on labels, so it is independent of
    # `deviceLabelFields`. All three minis carry the same Vega 11 (1002:15dd),
    # so this labels all three — Jellyfin is free to run on any of them and is
    # no longer pinned to whichever node happened to be labelled by hand.
    - name: amd.vega
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["1002"]}
            device: {op: In, value: ["15dd"]}
      labels:
        media/gpu: "amd-vega"
    # The CyberPower UPS attached to drone-03. Matching the raw USB feature
    # keeps `deviceClassWhitelist` at its default: that option replaces rather
    # than extends the list, so adding HID (03) there would drop `ff` and take
    # `usb-ff_10c4_ea60.present` with it, leaving zigbee2mqtt unable to
    # schedule on its next restart. Rules match features, so no whitelist edit
    # is needed. This unit reports no USB serial, hence the model match.
    - name: cyberpower.ups
      matchFeatures:
        - feature: usb.device
          matchExpressions:
            class: {op: In, value: ["03"]}
            vendor: {op: In, value: ["0764"]}
            device: {op: In, value: ["0601"]}
      labels:
        hardware/ups: "or2200pfcrt2u"
