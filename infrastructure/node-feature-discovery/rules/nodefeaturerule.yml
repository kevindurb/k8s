---
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: amd-vega-gpu
spec:
  rules:
    # Matches on raw PCI features, not on labels, so it is independent of
    # `deviceLabelFields`. All three minis carry the same Vega 11 (1002:15dd),
    # so this labels all three — Jellyfin is free to run on any of them and is
    # no longer pinned to whichever node happened to be labelled by hand.
    - name: amd.vega
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["1002"]}
            device: {op: In, value: ["15dd"]}
      labels:
        media/gpu: "amd-vega"
