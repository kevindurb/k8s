---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: speedtest-exporter-
namespace: speedtest-exporter

resources:
  - ./deployment.yml

configMapGenerator:
  # The exporter reads /config/config.yaml by default, so the key basename is
  # load-bearing and the whole ConfigMap is mounted at /config.
  - name: config
    files:
      - ./config/config.yaml
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - speedtest-exporter.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: speedtest-exporter
