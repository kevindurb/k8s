---
global:
  scrape_interval: 1m
  evaluation_interval: 5m
  scrape_timeout: 10s

rule_files:
  - ./rules/*.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [alertmanager-app-service.alertmanager.svc.cluster.local]

scrape_configs:
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: kubelet
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metric_relabel_configs:
      # In k3s the kubelet /metrics endpoint also exposes the control-plane
      # (apiserver/etcd) metrics, so this job re-scrapes everything the
      # k8apiserver job already collects. Drop those duplicates here.
      - source_labels: [__name__]
        regex: '(apiserver|etcd)_.*'
        action: drop
      # No alert/dashboard queries kubelet histogram buckets, and they are
      # high cardinality; keep _sum/_count/gauges/counters instead.
      - source_labels: [__name__]
        regex: '.*_bucket'
        action: drop

  - job_name: cadvisor
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metrics_path: /metrics/cadvisor

  - job_name: k8apiserver
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_service_name
          - __meta_kubernetes_endpoint_port_name
        action: keep
        regex: default;kubernetes;https
    metric_relabel_configs:
      # Drop the apiserver/etcd histogram buckets. Their label combinations
      # (verb x resource x scope x instance) dominate the TSDB and make
      # compaction very expensive; nothing here queries the buckets. _sum and
      # _count stay, so request rates and average latency still work.
      - source_labels: [__name__]
        regex: '.*_bucket'
        action: drop

  - job_name: kubernetes-service-endpoints
    # smartctl-exporter blocks /metrics while it polls devices; on drone-02 the
    # 32 NVMe-oF controllers push a poll past the 10s global timeout, so one
    # target flaps. Fast scrapes are unaffected by a longer timeout.
    scrape_timeout: 45s
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true

      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)

      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)(?::\d+);(\d+)
        replacement: $1:$2

      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)

      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace

      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_name

      - action: replace
        source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
