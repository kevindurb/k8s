---
groups:
  - name: Watchdog
    rules:
      - alert: Watchdog
        annotations:
          description: >
            This is a Watchdog meant to ensure that the
            entire alerting pipeline is functional.
          summary: Alerting Watchdog
        expr: vector(1)
        labels:
          severity: none
  - name: ArgoCD
    rules:
      - alert: ArgocdServiceNotSynced
        expr: argocd_app_info{sync_status!="Synced"} != 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ArgoCD service not synced (instance {{ $labels.instance }})
          description: |-
            Service {{ $labels.name }} run by argo is currently not in sync.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: ArgocdServiceUnhealthy
        expr: argocd_app_info{health_status!="Healthy"} != 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ArgoCD service unhealthy (instance {{ $labels.instance }})
          description: |-
            Service {{ $labels.name }} run by argo is currently not healthy.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

  - name: Gatus
    rules:
      - alert: GatusTargetUnsuccessful
        expr: 'increase(gatus_results_total{success="false"}[2m]) > 1'
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Gatus target unsuccessful (name {{ $labels.name }})
          description: |-
            A gatus target is unsuccessful for at least 2m. A service may have crashed.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

  - name: NodeExporter
    rules:
      - alert: HostOutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < .05)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host out of memory (instance {{ $labels.instance }})
          description: |-
            Node memory is filling up (< 5% left)
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: HostHighCpuUsage
        expr: 100 - (avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host high CPU usage (instance {{ $labels.instance }})
          description: |-
            CPU usage is above 90% for an extended period.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: HostCpuHighIowait
        expr: avg without (cpu) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > .10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host CPU high iowait (instance {{ $labels.instance }})
          description: |-
            CPU iowait > 10%. Your CPU is idling waiting for storage to respond.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: HostDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint!="/boot"}
          / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host disk space low (instance {{ $labels.instance }})
          description: |-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} <15% space remaining.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: HostPhysicalComponentTooHot
        expr: node_hwmon_temp_celsius > node_hwmon_temp_max_celsius
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host physical component too hot (instance {{ $labels.instance }})
          description: |-
            Physical hardware component too hot
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: HostOomKillDetected
        expr: (increase(node_vmstat_oom_kill[30m]) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host OOM kill detected (instance {{ $labels.instance }})
          description: |-
            OOM kill detected
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

  - name: Longhorn
    rules:
      - alert: LonghornNodeDown
        expr: longhorn_node_status{condition="ready"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Longhorn node {{ $labels.node }} is down.
          description: |-
            Longhorn node {{ $labels.node }} has been down for more than 5 minutes.

      - alert: LonghornVolumeActualSpaceUsedWarning
        expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The actual used space of Longhorn volume is over 90% of the capacity.
          description: |-
            The actual space used by Longhorn volume {{ $labels.volume }} on {{ $labels.node }}
            is at {{ $value }}% capacity for more than 5 minutes.

      - alert: LonghornVolumeStatusCritical
        expr: longhorn_volume_robustness == 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Longhorn volume {{ $labels.volume }} is Fault
          description: |-
            Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is Fault for
            more than 5 minutes.

      - alert: LonghornVolumeStatusWarning
        expr: longhorn_volume_robustness == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Longhorn volume {{ $labels.volume }} is Degraded
          description: |-
            Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is Degraded for
            more than 5 minutes.

      - alert: LonghornDiskStorageWarning
        expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The used storage of disk is over 80% of the capacity.
          description: |-
            The used storage of disk {{ $labels.disk }} on node {{ $labels.node }}
            is at {{ $value }}% capacity for more than 5 minutes.

      - alert: LonghornBackupFailed
        expr: longhorn_backup_state == 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Longhorn backup {{ $labels.backup }} failed.
          description: |-
            Longhorn backup {{ $labels.backup }} of volume {{ $labels.volume }}
            has been in the Error state for more than 15 minutes.

      - alert: LonghornNoRecentBackup
        expr: (count((longhorn_backup_state == 3) unless (longhorn_backup_state offset 24h == 3)) or vector(0)) == 0
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: No Longhorn backup has completed in the last 24 hours.
          description: |-
            No new completed Longhorn backup has appeared in 24h, so the
            daily-backup recurring job is not running. Stale Backup records
            from previous runs do not clear this alert.

  - name: Network
    rules:
      - alert: HostNetworkInterfaceSlow
        expr: >
          node_network_speed_bytes{device=~"en.*"} < 125000000
          and node_network_speed_bytes{device=~"en.*"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host network interface negotiated below 1 Gb/s (instance {{ $labels.instance }})
          description: |-
            {{ $labels.device }} on {{ $labels.instance }} is linked at {{ $value | humanize }}B/s
            (< 1 Gb/s). Usually a bad cable, connector or switch port.
            LABELS = {{ $labels }}

      - alert: HostNetworkLinkDown
        expr: node_network_carrier{device=~"en.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Host network link down (instance {{ $labels.instance }})
          description: |-
            {{ $labels.device }} on {{ $labels.instance }} has no carrier.
            LABELS = {{ $labels }}

      - alert: HostNetworkLinkFlapping
        expr: increase(node_network_carrier_changes_total{device=~"en.*"}[1h]) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host network link flapping (instance {{ $labels.instance }})
          description: |-
            {{ $labels.device }} on {{ $labels.instance }} changed carrier state {{ $value }} times in the last hour.
            LABELS = {{ $labels }}

      - alert: HostNetworkErrors
        expr: >
          increase(node_network_receive_errs_total{device=~"en.*"}[1h])
          + increase(node_network_transmit_errs_total{device=~"en.*"}[1h]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host network interface errors (instance {{ $labels.instance }})
          description: |-
            {{ $labels.device }} on {{ $labels.instance }} had {{ $value }} rx/tx errors in the last hour.
            A healthy link has none.
            LABELS = {{ $labels }}

      - alert: HostNetworkCrcErrors
        expr: increase(node_ethtool_rx_crc_errors{device=~"en.*"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host network CRC errors (instance {{ $labels.instance }})
          description: |-
            {{ $labels.device }} on {{ $labels.instance }} saw {{ $value }} CRC errors in the last hour,
            which points at a bad cable or port.
            LABELS = {{ $labels }}

  - name: ZFS
    rules:
      - alert: ZfsOfflinePool
        expr: node_zfs_zpool_state{state!="online"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ZFS offline pool (instance {{ $labels.instance }})
          description: |-
            A ZFS zpool is in a unexpected state: {{ $labels.state }}.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

  - name: SmartctlExporter
    rules:
      - alert: SmartDeviceTemperatureWarning
        expr: >
          (
            avg_over_time(smartctl_device_temperature{temperature_type="current"} [5m])
            unless on (instance, device) smartctl_device_temperature{temperature_type="drive_trip"} > 0
          ) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SMART device temperature warning (instance {{ $labels.instance }})
          description: |-
            Device temperature {{ $labels.instance }} drive {{ $labels.device }} > 60°C
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartDeviceTemperatureCritical
        expr: >
          (
            max_over_time(smartctl_device_temperature{temperature_type="current"} [5m])
            unless on (instance, device) smartctl_device_temperature{temperature_type="drive_trip"} > 0
          ) > 70
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SMART device temperature critical (instance {{ $labels.instance }})
          description: |-
            Device temperature {{ $labels.instance }} drive {{ $labels.device }} > 70°C
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartDeviceTemperatureOverTripValue
        expr: >
          max_over_time(
            smartctl_device_temperature{temperature_type="current"} [10m]
          ) >= on(device, instance) smartctl_device_temperature{temperature_type="drive_trip"}
          and on(device, instance)
          smartctl_device_temperature{temperature_type="drive_trip"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SMART device temperature over trip value (instance {{ $labels.instance }})
          description: |-
            Device temperature over trip value on {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartDeviceTemperatureNearingTripValue
        expr: >
          max_over_time(
            smartctl_device_temperature{temperature_type="current"} [10m]
          ) >= on(device, instance)
          (smartctl_device_temperature{temperature_type="drive_trip"} * .80)
          and on(device, instance)
          smartctl_device_temperature{temperature_type="drive_trip"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SMART device temperature nearing trip value (instance {{ $labels.instance }})
          description: |-
            Device temperature trip value {{ $labels.instance }} drive {{ $labels.device }} > 80%
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartStatus
        expr: smartctl_device_smart_status != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SMART status (instance {{ $labels.instance }})
          description: |-
            Device has a SMART status failure on {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartCriticalWarning
        expr: smartctl_device_critical_warning > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SMART critical warning (instance {{ $labels.instance }})
          description: |-
            Disk controller critical warning {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartMediaErrors
        expr: smartctl_device_media_errors > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SMART media errors (instance {{ $labels.instance }})
          description: |-
            Disk controller detected errors {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartWearoutIndicator
        expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SMART Wearout Indicator (instance {{ $labels.instance }})
          description: |-
            Device is wearing out on {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartReallocatedSectors
        expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SMART reallocated sectors (instance {{ $labels.instance }})
          description: |-
            Disk has reallocated bad sectors on {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartPendingSectors
        expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SMART pending sectors (instance {{ $labels.instance }})
          description: |-
            Disk has unreadable sectors awaiting remap on {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: SmartInterfaceCrcErrors
        expr: smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SMART interface CRC errors (instance {{ $labels.instance }})
          description: |-
            SATA cable or connector issues on {{ $labels.instance }} drive {{ $labels.device }}
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

  - name: DemocraticCSI
    rules:
      - alert: CsiPvStuck
        expr: kube_persistentvolume_status_phase{phase=~"Released|Failed"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: PersistentVolume {{ $labels.persistentvolume }} stuck in {{ $labels.phase }}
          description: |-
            Usually democratic-csi DeleteVolume failing on dependent (sanoid) snapshots.
            See the democratic-csi skill, Gotchas.

      - alert: CsiControllerDown
        expr: kube_deployment_status_replicas_available{namespace="democratic-csi"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: democratic-csi controller {{ $labels.deployment }} has no available replicas

      - alert: CsiNodeDriverUnavailable
        expr: kube_daemonset_status_number_unavailable{namespace="democratic-csi"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: democratic-csi node driver unavailable on {{ $value }} node(s)

      - alert: CsiPodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="democratic-csi"}[30m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: democratic-csi pod {{ $labels.pod }} ({{ $labels.container }}) restarting

      - alert: StorageNodeDown
        expr: kube_node_status_condition{node="drone-04",condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: drone-04 (NVMe-oF/ZFS backend) is NotReady
          description: |-
            All democratic-csi volumes depend on drone-04. Initiators drop their
            controllers after ~10 minutes (ctrl_loss_tmo).

      - alert: CsiVolumeAttachmentStuck
        expr: kube_volumeattachment_status_attached{volumeattachment=~"csi-.*"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VolumeAttachment {{ $labels.volumeattachment }} not attached

      - alert: PodStuckContainerCreating
        expr: kube_pod_container_status_waiting_reason{reason="ContainerCreating"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in ContainerCreating
          description: Often a failed volume mount or mkfs (see the MDTS gotcha in the democratic-csi skill).

      - alert: PvcFillingUp
        expr: predict_linear(kubelet_volume_stats_available_bytes[6h], 4 * 24 * 3600) < 0 and kubelet_volume_stats_available_bytes > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} will fill within 4 days

      - alert: PvcInodesLow
        expr: kubelet_volume_stats_inodes_free / kubelet_volume_stats_inodes * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has < 10% free inodes

  - name: StoragePerformance
    rules:
      - alert: StorageNicSaturated
        expr: |
          rate(node_network_transmit_bytes_total{instance="drone-04",device="enp5s0"}[5m]) > 100e6
          or
          rate(node_network_receive_bytes_total{instance="drone-04",device="enp5s0"}[5m]) > 100e6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: drone-04 1GbE link above 100 MB/s ({{ $labels.device }})

      - alert: BackendHddHighUtilisation
        expr: rate(node_disk_io_time_seconds_total{instance="drone-04",device=~"sd[a-z]+"}[5m]) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: drone-04 disk {{ $labels.device }} is >90% busy

      - alert: BackendHddHighLatency
        expr: |
          rate(node_disk_read_time_seconds_total{instance="drone-04",device=~"sd[a-z]+"}[5m])
            / (rate(node_disk_reads_completed_total{instance="drone-04",device=~"sd[a-z]+"}[5m]) > 1) > 0.05
          or
          rate(node_disk_write_time_seconds_total{instance="drone-04",device=~"sd[a-z]+"}[5m])
            / (rate(node_disk_writes_completed_total{instance="drone-04",device=~"sd[a-z]+"}[5m]) > 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: drone-04 disk {{ $labels.device }} average I/O latency > 50ms

      - alert: NvmeofInitiatorHighLatency
        expr: |
          rate(node_disk_read_time_seconds_total{instance=~"drone-0[123]",device=~"nvme[0-9]+n[0-9]+"}[5m])
            / (rate(node_disk_reads_completed_total{instance=~"drone-0[123]",device=~"nvme[0-9]+n[0-9]+"}[5m]) > 1) > 0.05
          or
          rate(node_disk_write_time_seconds_total{instance=~"drone-0[123]",device=~"nvme[0-9]+n[0-9]+"}[5m])
            / (rate(node_disk_writes_completed_total{instance=~"drone-0[123]",device=~"nvme[0-9]+n[0-9]+"}[5m]) > 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NVMe device {{ $labels.device }} on {{ $labels.instance }} average I/O latency > 50ms
          description: >-
            Includes the local NVMe boot disk on drone-01..03, but is dominated
            by NVMe-oF volumes when they are slow.

      - alert: NvmeofInitiatorQueueBacklog
        expr: rate(node_disk_io_time_weighted_seconds_total{instance=~"drone-0[123]",device=~"nvme[0-9]+n[0-9]+"}[5m]) > 8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NVMe device {{ $labels.device }} on {{ $labels.instance }} average queue depth > 8

      - alert: StorageNicRetransmits
        expr: rate(node_netstat_Tcp_RetransSegs{instance="drone-04"}[5m]) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: drone-04 TCP retransmits high ({{ $value | humanize }}/s)

  - name: ZfsExporter
    rules:
      - alert: ZfsExporterDown
        expr: up{job="kubernetes-service-endpoints",kubernetes_namespace="zfs-exporter"} == 0 or absent(up{kubernetes_namespace="zfs-exporter"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: zfs_exporter on drone-04 is unreachable

      - alert: ZfsPoolCapacityHigh
        expr: zfs_pool_allocated_bytes / zfs_pool_size_bytes * 100 > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ZFS pool {{ $labels.pool }} is {{ $value | humanize }}% full

      - alert: ZfsPoolCapacityCritical
        expr: zfs_pool_allocated_bytes / zfs_pool_size_bytes * 100 > 90
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: ZFS pool {{ $labels.pool }} is {{ $value | humanize }}% full (ZFS slows down badly above ~90%)

      - alert: ZfsPoolFragmentationHigh
        expr: zfs_pool_fragmentation_ratio > 0.5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: ZFS pool {{ $labels.pool }} fragmentation above 50%

      - alert: ZfsPoolUnhealthy
        expr: zfs_pool_health > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ZFS pool {{ $labels.pool }} health is not ONLINE

      - alert: ZfsPoolFreeSpaceLow
        expr: zfs_pool_free_bytes < 500e9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ZFS pool {{ $labels.pool }} has under 500 GB free

  - name: Kubernetes
    rules:
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes Node not ready (instance {{ $labels.instance }})
          description: |-
            Node {{ $labels.node }} has been unready for a long time
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: KubernetesContainerOomKiller
        expr: >
          (
            kube_pod_container_status_restarts_total
            - kube_pod_container_status_restarts_total offset 10m >= 1
          )
          and ignoring (reason)
          min_over_time(
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]
          ) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes Container oom killer (instance {{ $labels.instance }})
          description: |-
            Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
            has been OOMKilled {{ $value }} times in the last 10 minutes.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: KubernetesJobFailed
        expr: increase(kube_job_status_failed[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes Job failed (instance {{ $labels.instance }})
          description: |-
            Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: KubernetesPersistentvolumeclaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes PersistentVolumeClaim pending (instance {{ $labels.instance }})
          description: |-
            PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: KubernetesVolumeOutOfDiskSpace
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes Volume out of disk space (instance {{ $labels.instance }})
          description: |-
            Volume is almost full (< 10% left)
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: KubernetesPodNotHealthy
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes Pod not healthy (instance {{ $labels.instance }})
          description: |-
            Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-running state
            for longer than 15 minutes.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: KubernetesPodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes pod crash looping (instance {{ $labels.instance }})
          description: |-
            Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

  - name: Prometheus
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0 unless on(job) (sum by (job) (up) == 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Prometheus target missing (instance {{ $labels.instance }})
          description: |-
            A Prometheus target has disappeared. An exporter might be crashed.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: PrometheusAllTargetsMissing
        expr: sum by (job) (up) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Prometheus all targets missing (instance {{ $labels.instance }})
          description: |-
            A Prometheus job does not have living target anymore.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}

      - alert: PrometheusRuleEvaluationSlow
        expr: prometheus_rule_group_last_duration_seconds > prometheus_rule_group_interval_seconds
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus rule evaluation slow (instance {{ $labels.instance }})
          description: |-
            Prometheus rule evaluation took more time than the scheduled interval.
            It indicates a slower storage backend access or too complex query.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
  - name: Deployments
    rules:
      - alert: ContainerImageChanged
        expr: |
          sum by (namespace, container, image) (kube_pod_container_info)
            unless on (namespace, container, image)
          sum by (namespace, container, image) (kube_pod_container_info offset 10m)
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Container image changed in {{ $labels.namespace }}
          description: Container '{{ $labels.container }}' in namespace '{{ $labels.namespace }}' updated its image to '{{ $labels.image }}'.
