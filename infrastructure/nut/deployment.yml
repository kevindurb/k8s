---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels: &labels
    app.kubernetes.io/component: app
spec:
  replicas: 1
  # One USB device, one pod. Never two of these fighting over /dev/bus/usb.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      # The NFD rule in infrastructure/node-feature-discovery/rules emits this
      # on whichever node the UPS is plugged into. Node labels gate scheduling
      # only, so moving the cable still needs a pod roll to follow it.
      nodeSelector:
        hardware/ups: or2200pfcrt2u
      volumes:
        # ups.conf and upsd.conf from the ConfigMap, upsd.users from the
        # SealedSecret, projected into the single directory NUT_CONFPATH reads.
        - name: config
          projected:
            sources:
              - configMap:
                  name: app-config
                  items:
                    - {key: ups.conf, path: ups.conf}
                    - {key: upsd.conf, path: upsd.conf}
              - secret:
                  # Post-namePrefix name of the Secret sealed-secrets creates
                  # from `upsd-users`; kustomize cannot rewrite this reference
                  # because the Secret itself is not a kustomize resource.
                  name: nut-upsd-users
                  items:
                    - {key: upsd.users, path: upsd.users}
        # A HID device gets no /dev/serial/by-id or /dev/hidraw/by-id symlink,
        # and its bus path has already changed twice (2-3 -> 4-2 -> 1-3), so
        # mount the whole tree and let libusb identify the unit by vendor ID.
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: sysusb
          hostPath:
            path: /sys/bus/usb
            type: Directory
        - name: udev
          hostPath:
            path: /run/udev
            type: Directory
        - name: state
          emptyDir: {}
      containers:
        - name: app
          image: instantlinux/nut-upsd:2.8.5-1@sha256:5c7386822103525bba26bf06fb9ba40f1a3704fc9593feceb9bd09d672db85aa
          # usbhid-ups has no other way to reach the device.
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests: {memory: 16Mi}
            limits: {cpu: 200m, memory: 128Mi}
          env:
            - name: TZ
              value: America/Denver
          # Deliberately NOT the image entrypoint: that starts upsmon with a
          # shutdown command, and this deployment only observes. upsd stays in
          # the foreground so a wedged NUT takes the pod down with it.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export NUT_CONFPATH=/config NUT_STATEPATH=/run/nut
              mkdir -p "$NUT_STATEPATH"
              /usr/lib/nut/usbhid-ups -a ups -u root &
              exec /usr/sbin/upsd -u root -D
          ports:
            - name: nut
              containerPort: 3493
              protocol: TCP
          # upsc is the cheapest proof that upsd is answering with live data.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "upsc ups@127.0.0.1 ups.status"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "upsc ups@127.0.0.1 ups.status"]
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: usb, mountPath: /dev/bus/usb}
            - {name: sysusb, mountPath: /sys/bus/usb, readOnly: true}
            - {name: udev, mountPath: /run/udev, readOnly: true}
            - {name: state, mountPath: /run/nut}
        # A NUT client, not a device client: no USB, no privileges. Lives in
        # this pod so the Service's prometheus.io annotations name one object
        # and `instance` resolves to the node the UPS is attached to.
        - name: exporter
          image: druggeri/nut_exporter:3.3@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
          args:
            - --nut.server=127.0.0.1
            - --web.listen-address=:9199
            # The default variable list omits battery.runtime.
            - --nut.vars_enable=ups.load,ups.status,battery.charge,battery.runtime,input.voltage,output.voltage,battery.voltage,ups.realpower.nominal
          resources:
            requests: {memory: 8Mi}
            limits: {cpu: 100m, memory: 64Mi}
          ports:
            - name: http
              containerPort: 9199
              protocol: TCP
          # No health endpoint; only prove the listener is up.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            failureThreshold: 3

---
kind: Service
apiVersion: v1
metadata:
  name: app-service
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9199'
    prometheus.io/path: '/ups_metrics'
spec:
  ports:
    - name: nut
      protocol: TCP
      port: 3493
      targetPort: nut
    - name: http
      protocol: TCP
      port: 9199
      targetPort: http
