---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nut
namePrefix: nut-

resources:
  - ./deployment.yml
  - ./upsd-users-sealed-secret.yml

configMapGenerator:
  - name: app-config
    files:
      - ups.conf
      - upsd.conf

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: nut
