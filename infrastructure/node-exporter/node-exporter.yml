---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon-set
spec:
  template:
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --no-collector.wifi
            - --collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
            - --collector.netclass.ignored-devices=^(veth.*)$
            - --collector.ethtool
            - --collector.ethtool.device-include=^en.*
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          # node_exporter has no /-/healthy; / is the cheap landing page, while
          # /metrics runs every collector and must not be probed.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              cpu: 250m
              memory: 180Mi
          volumeMounts:
            - mountPath: /host/sys
              mountPropagation: HostToContainer
              name: sys
              readOnly: true
            - mountPath: /host/root
              mountPropagation: HostToContainer
              name: root
              readOnly: true
      volumes:
        - hostPath:
            path: /sys
          name: sys
        - hostPath:
            path: /
          name: root

---
kind: Service
apiVersion: v1
metadata:
  name: service
  annotations:
    prometheus.io/scrape: 'true'
spec:
  ports:
    - name: node-exporter
      protocol: TCP
      port: 9100
      targetPort: 9100
