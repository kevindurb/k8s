---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alertmanager
namePrefix: alertmanager-

resources:
  - ./alertmanager.yml
  - ./alertmanager-sealed-secret.yml

components:
  - ../../components/storage-home-drone-03
  - ../../components/app-pod-hardening
  - ../../components/app-http-service
  - ../../components/prometheus-scrape-app-service

configMapGenerator:
  - name: config
    files:
      - ./config/alertmanager.yml
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - alertmanager.yml=gatus.yml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: alertmanager
