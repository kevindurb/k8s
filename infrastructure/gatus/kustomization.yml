---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gatus
namePrefix: gatus-

resources:
  - ./deployment.yml
  - ./rbac.yml

components:
  - ../../components/app-env
  - ../../components/app-http-service
  - ../../components/app-pod-hardening
  - ../../components/app-tmp-dirs
  # Gatus exposes /metrics (gatus_results_total and friends); without the
  # scrape annotation the GatusTargetUnsuccessful rule has no data.
  - ../../components/prometheus-scrape-app-service

configMapGenerator:
  - name: config
    files:
      - ./config/gatus.yml
  - name: app-env
    literals:
      - GATUS_LOG_LEVEL=DEBUG
      - GATUS_CONFIG_PATH=/config

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: gatus
