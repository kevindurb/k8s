---
metrics: true
storage:
  type: sqlite
  path: /config/data.db

endpoints:
  - name: gatus
    url: http://gatus-app-service
    group: infrastructure
    conditions: ['[STATUS] == 200']

  - name: google
    url: https://google.com
    group: external
    conditions: ['[STATUS] == 200']

  - name: github
    url: https://github.com
    group: external
    conditions: ['[STATUS] == 200']

  - name: firefox portal
    url: http://detectportal.firefox.com/success.txt
    group: external
    conditions: ['[STATUS] == 200']

  - name: router
    url: https://192.168.1.1
    group: networking
    client: { insecure: true }
    conditions: ['[STATUS] == 200']

  - name: Garage AP
    url: http://192.168.1.2
    group: networking
    conditions: ['[STATUS] == 200']

  - name: Basement AP
    url: http://192.168.1.3
    group: networking
    conditions: ['[STATUS] == 200']

  - name: Backyard AP
    url: http://192.168.1.4
    group: networking
    conditions: ['[STATUS] == 200']

  - name: Doorbell Camera
    url: http://192.168.50.1
    group: cameras
    conditions: ['[STATUS] == 200']

  - name: Garage Camera
    url: http://192.168.50.2
    group: cameras
    conditions: ['[STATUS] == 200']

  - name: cloudflare dns
    url: 1.1.1.1
    group: dns
    dns:
      query-name: cloudflare.com
      query-type: A
    conditions:
      - '[DNS_RCODE] == NOERROR'
      - 'len([BODY]) > 0'

  - name: unimatrix-01-ping
    group: nodes
    url: icmp://192.168.42.11
    conditions:
      - "[CONNECTED] == true"

  - name: unimatrix-02-ping
    group: nodes
    url: icmp://192.168.42.12
    conditions:
      - "[CONNECTED] == true"

  - name: unimatrix-03-ping
    group: nodes
    url: icmp://192.168.42.13
    conditions:
      - "[CONNECTED] == true"

  - name: drone-01-ping
    group: nodes
    url: icmp://192.168.42.21
    conditions:
      - "[CONNECTED] == true"

  - name: drone-02-ping
    group: nodes
    url: icmp://192.168.42.22
    conditions:
      - "[CONNECTED] == true"

  - name: drone-03-ping
    group: nodes
    url: icmp://192.168.42.23
    conditions:
      - "[CONNECTED] == true"

  - name: drone-04-ping
    group: nodes
    url: icmp://192.168.42.24
    conditions:
      - "[CONNECTED] == true"

  - name: unimatrix-01-kubelet
    group: nodes
    url: tcp://192.168.42.11:10250
    conditions:
      - "[CONNECTED] == true"

  - name: unimatrix-02-kubelet
    group: nodes
    url: tcp://192.168.42.12:10250
    conditions:
      - "[CONNECTED] == true"

  - name: unimatrix-03-kubelet
    group: nodes
    url: tcp://192.168.42.13:10250
    conditions:
      - "[CONNECTED] == true"

  - name: drone-01-kubelet
    group: nodes
    url: tcp://192.168.42.21:10250
    conditions:
      - "[CONNECTED] == true"

  - name: drone-02-kubelet
    group: nodes
    url: tcp://192.168.42.22:10250
    conditions:
      - "[CONNECTED] == true"

  - name: drone-03-kubelet
    group: nodes
    url: tcp://192.168.42.23:10250
    conditions:
      - "[CONNECTED] == true"

  - name: drone-04-kubelet
    group: nodes
    url: tcp://192.168.42.24:10250
    conditions:
      - "[CONNECTED] == true"
