---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress-proxy-group
spec:
  type: ingress
  replicas: 2

---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: borg-cluster
spec:
  type: kube-apiserver
  replicas: 2
  kubeAPIServer:
    mode: auth

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kevindurb-masters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:masters
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: kevindurb@github
