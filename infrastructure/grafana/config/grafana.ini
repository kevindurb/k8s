# Grafana configuration for the homelab.
#
# Secrets are NOT here: they come from the grafana-secrets Secret (SealedSecret)
# as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET and GF_SECURITY_ADMIN_PASSWORD env vars,
# which take precedence over anything set in this file.
# Everything else that is environment-specific lives in git.

[server]
domain = grafana.beaver-cloud.ts.net
root_url = https://grafana.beaver-cloud.ts.net
enable_gzip = true

[log]
# Reachable through `kubectl logs`; no log files on the read-only rootfs.
mode = console
level = info

[analytics]
# This is a private homelab; no phone-home.
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[unified_alerting]
# Prometheus rules + Alertmanager are the alerting path for this cluster.
# Running Grafana's unified alerting as well would give two alert evaluation
# layers for no benefit.
enabled = false

[auth]
disable_login_form = false

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = Pocket ID
client_id = grafana
scopes = openid profile email groups
auth_url = https://idp.beaver-cloud.ts.net/authorize
token_url = https://idp.beaver-cloud.ts.net/api/oidc/token
api_url = https://idp.beaver-cloud.ts.net/api/oidc/userinfo
use_pkce = true
allow_sign_up = true
# Single-user homelab: the one real user gets Org Admin, everyone else Viewer.
# No Pocket ID groups required; to promote someone else later, add them to the
# allow-list here or switch this to a `groups` claim.
role_attribute_path = email == 'kevindurb@fastmail.com' && 'Admin' || 'Viewer'
# Grafana server-admin is deliberately NOT granted; org admin is enough and
# server admin would let the account mutate plugins/provisioning.

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[security]
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
