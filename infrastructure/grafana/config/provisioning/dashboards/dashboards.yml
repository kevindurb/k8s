apiVersion: 1

# Dashboards are vendored under config/dashboards/ (see SOURCES.md there) and
# mounted from two ConfigMaps (split for the 1 MiB ConfigMap size limit).
# Both providers load flat into the root folder.
providers:
  - name: imported-a
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
  - name: imported-b
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards-extra
      foldersFromFilesStructure: false
