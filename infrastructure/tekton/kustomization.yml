---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tekton-pipelines

resources:
  - ./dashboard-release.yaml
  - ./dashboard-ingress.yml


configMapGenerator:
  - name: gatus
    options:
      labels:
        gatus.io/enabled: 'true'
    files:
      - tekton.yml=gatus.yml
