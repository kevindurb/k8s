---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  annotations:
    tailscale.com/proxy-group: ingress-proxy-group
    tailscale.com/tags: tag:infra
spec:
  defaultBackend:
    service:
      name: tekton-dashboard
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts: [tekton]
