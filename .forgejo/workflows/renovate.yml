---
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

jobs:
  renovate:
    name: Renovate
    runs-on: podman

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.0
        with:
          configurationFile: .forgejo/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: 'debug'
