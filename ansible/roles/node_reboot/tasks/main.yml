# SPDX-License-Identifier: MIT-0
---
- name: Refuse to run the generic reboot on the storage node
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} serves storage for the whole cluster (ZFS + NVMe-oF target), so a drain
      and reboot is not safe. Use reboot-drone-04.yml instead.
  when: inventory_hostname in node_reboot_refuse_hosts

- name: Drain node
  delegate_to: localhost
  ansible.builtin.command:
    cmd: >
      kubectl drain
      --delete-emptydir-data
      --ignore-daemonsets
      {{ ansible_hostname }}
  changed_when: false

- name: Stop k3s service
  become: true
  ansible.builtin.systemd_service:
    name: '{{ (k3s_role == "agent") | ternary("k3s-agent.service", "k3s.service") }}'
    state: stopped

- name: Reboot node
  become: true
  ansible.builtin.reboot:

- name: Ensure k3s is running
  become: true
  ansible.builtin.systemd_service:
    name: '{{ (k3s_role == "agent") | ternary("k3s-agent.service", "k3s.service") }}'
    state: started

- name: Uncordon node
  delegate_to: localhost
  kubernetes.core.k8s_drain:
    state: uncordon
    name: '{{ ansible_hostname }}'
