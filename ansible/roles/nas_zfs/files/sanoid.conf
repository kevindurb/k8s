[rust/media]
use_template = production
recursive = no

[rust/k8s/volumes]
use_template = volumes
recursive = yes
process_children_only = yes

# Opt-out template for churny, rebuildable volumes that should NOT get the
# parent's hourly/daily grid: a Redis-style cache rewrites itself constantly, and
# its snapshot history can dwarf its data (romm's did: 62 GiB of history on
# ~4 GiB of data). That volume is now an emptyDir instead, but the template stays
# for the next one (prometheus TSDB, ML caches) — use it in a child stanza rather
# than letting the recursive parent apply.
[template_nosnap]
frequently = 0
hourly = 0
daily = 0
weekly = 0
monthly = 0
yearly = 0
autosnap = no
autoprune = yes

[template_production]
frequently = 0
hourly = 36
daily = 30
weekly = 8
monthly = 6
yearly = 0
autosnap = yes
autoprune = yes

[template_volumes]
frequently = 0
hourly = 24
daily = 14
weekly = 4
monthly = 0
yearly = 0
autosnap = yes
autoprune = yes
