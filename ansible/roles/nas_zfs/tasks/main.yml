# SPDX-License-Identifier: MIT-0
---
# The image ships a 2 GiB cap, sized for the app nodes that each run a pool and a
# dozen pods in ~22 GiB. This node does nothing but ZFS + NFS, so it gets the RAM.
# The filename is load-bearing: modprobe.d files are read in lexicographic order
# and the last `options zfs` wins, so the file must sort AFTER the image's
# `zfs.conf`. `zz-` does; the original `99-zfs-arc.conf` did not ("9" < "z"), which
# is why this node silently ran the image's 2 GiB cap. The live write is what
# makes it take effect without a reboot.
- name: Cap the ZFS ARC for this storage node
  ansible.builtin.copy:
    content: |
      # Rendered by ansible/roles/nas_zfs. Must sort after /etc/modprobe.d/zfs.conf
      # from the image: modprobe.d is read in lexicographic order and the last
      # `options zfs` wins.
      options zfs zfs_arc_max={{ nas_zfs_arc_max_bytes }}
    dest: /etc/modprobe.d/zz-zfs-arc.conf
    mode: '0644'

# The old name sorted before zfs.conf and therefore never applied. Remove it so a
# hand-inspected node doesn't suggest a cap that is not in force.
- name: Remove the superseded ARC cap file
  ansible.builtin.file:
    path: /etc/modprobe.d/99-zfs-arc.conf
    state: absent

- name: Apply the ARC cap now
  ansible.builtin.shell: |
    set -o pipefail
    if [ "$(cat /sys/module/zfs/parameters/zfs_arc_max)" != "{{ nas_zfs_arc_max_bytes }}" ]; then
      echo {{ nas_zfs_arc_max_bytes }} > /sys/module/zfs/parameters/zfs_arc_max
      echo changed
    fi
  args:
    executable: /bin/bash
  register: nas_zfs_arc_apply
  changed_when: "'changed' in nas_zfs_arc_apply.stdout"

- name: Create rust zpool
  community.general.zpool:
    name: rust
    mountpoint: /var/mnt/rust
    pool_properties:
      autotrim: 'on'
    vdevs:
      - type: mirror
        disks: [/dev/sdb, /dev/sdc]
  # The 480 GB Team NVMe that used to sit here as an L2ARC read cache was retired
  # 2026-11-20: 7.7 % hit rate (2.2M hits / 29.2M requests) against 86 GB of writes
  # to a DRAM-less SSD, and its ~1.84 GB index was competing with a 2 GiB ARC.
  # The drive is now a wiped spare; do not add it back as a cache vdev here.

# `community.general.zpool` will not drop vdevs from an existing pool, so a node
# provisioned before the L2ARC was retired keeps it forever. Cache vdevs hold no
# pool data, so removing one is immediate and carries no risk.
- name: Look for a cache vdev on the rust pool
  ansible.builtin.shell: |
    set -o pipefail
    zpool list -H -o name rust >/dev/null 2>&1 || exit 0
    zpool status -P rust \
      | awk '/^[[:space:]]*cache$/{f=1; next} f && /^[[:space:]]*\/dev\//{print $1}'
  args:
    executable: /bin/bash
  register: nas_zfs_cache_devs
  changed_when: false

- name: Remove the retired L2ARC cache vdev
  ansible.builtin.command: "zpool remove rust {{ item }}"
  loop: "{{ nas_zfs_cache_devs.stdout_lines }}"
  when: nas_zfs_cache_devs.stdout_lines | length > 0
  changed_when: true

- name: Configure rust pool as NFSv4 pseudo-root
  community.general.zfs:
    name: rust
    state: present
    extra_zfs_properties:
      sharenfs: fsid=0,rw,sync,no_subtree_check,nohide,crossmnt,insecure,no_root_squash
  notify: [Restart NFS]

- name: Create media dataset
  community.general.zfs:
    name: rust/media
    state: present
    extra_zfs_properties:
      sharenfs: rw,sync,no_subtree_check,mountpoint,crossmnt,insecure,no_root_squash
      # atime=off: reads must not trigger atime COW writes (read-heavy share).
      # recordsize=1048576 == 1M. Written in bytes because the module compares the
      # raw `zfs get -p` value, and "1M" would always read back as a change.
      # (recordsize only affects newly written data.)
      atime: 'off'
      recordsize: '1048576'
  notify: [Restart NFS]

- name: Start NFS
  ansible.builtin.systemd_service:
    name: nfs-server
    state: started
    enabled: true

- name: Setup monthly scrub
  ansible.builtin.systemd_service:
    name: zfs-scrub-monthly@rust.timer
    state: started
    enabled: true

- name: Setup sanoid config
  ansible.builtin.copy:
    src: files/sanoid.conf
    dest: /etc/sanoid/sanoid.conf
    mode: '644'

- name: Setup sanoid timer
  ansible.builtin.systemd_service:
    name: sanoid.timer
    state: started
    enabled: true
