---
# vim: set ft=yaml.ansible
- name: Base provision
  tags: base
  hosts: all
  become: true
  tasks:
    - name: Set timezone to UTC
      community.general.timezone:
        name: UTC

    - name: Set ssh keys from github
      ansible.posix.authorized_key:
        user: core
        state: present
        key: https://github.com/kevindurb.keys

    - name: Set rpm_ostreed update policy
      ansible.builtin.copy:
        content: |
          [Daemon]
          AutomaticUpdatePolicy=stage
        dest: /etc/rpm-ostreed.conf
        mode: '644'

    - name: Enable rpm ostreed automatic
      ansible.builtin.service:
        name: rpm-ostreed-automatic.timer
        state: started
        enabled: true

    - name: Disable zincati
      ansible.builtin.service:
        name: zincati
        state: stopped
        enabled: false

    - name: Disable firewall
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false

    - name: Enable cockpit
      ansible.builtin.service:
        name: cockpit
        state: started
        enabled: true

    - name: Setup tuned profile
      ansible.builtin.command:
        cmd: tuned-adm profile {{ tuned_profile }}
      changed_when: false

- name: Setup storage
  tags: storage
  hosts: agents
  become: true
  tasks:
    - name: Format nvme
      community.general.filesystem:
        fstype: xfs
        dev: /dev/nvme0n1

    - name: Mount for longhorn
      ansible.posix.mount:
        path: /var/lib/longhorn
        src: /dev/nvme0n1
        fstype: xfs
        state: present

- name: Setup k3s
  tags: k3s
  hosts: all
  become: true
  serial: 1 # one k3s restart at a time
  roles: [k3s]
  post_tasks:
    - name: Wait for node to be Ready
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready node/{{ k3s_hostname }} --timeout=300s
      changed_when: false
      check_mode: false

- name: Setup drone-04 as NAS
  tags: zfs
  hosts: drone-04
  become: true
  roles: [nas_zfs]

- name: Setup tailscale
  tags: tailscale
  hosts: all
  become: true
  roles: [tailscale]
