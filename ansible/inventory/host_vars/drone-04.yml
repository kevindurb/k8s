---
k3s_role: agent
k3s_hostname: drone-04
k3s_server: 192.168.42.1
# storage-first node: general app pods stay off it so ZFS ARC gets the RAM
k3s_node_taints:
  - dedicated=storage:NoSchedule

# 8 GiB ARC: this node runs nothing but ZFS + NFS, unlike the app nodes that take
# the image's 2 GiB default (see ansible/roles/nas_zfs).
nas_zfs_arc_max_bytes: 8589934592

tuned_profile: k8s-node
