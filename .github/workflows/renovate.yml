---
name: Renovate

on:
  workflow_dispatch:
  schedule:
    # Hourly: Renovate restarts the repo job after an automerge, but only once, so a single
    # run merges at most 2 branches. Weekly meant the queue never drained.
    - cron: '0 * * * *'

# Don't let an over-running job overlap with the next scheduled run
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.0
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: 'debug'
          # The config file is passed as Renovate's *global* config, so the repo list has to
          # live here (or use autodiscover) - Renovate will not infer it from the checkout.
          RENOVATE_REPOSITORIES: kevindurb/k8s
